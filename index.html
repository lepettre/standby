html{font-synthesis:none}
:root{--accent:#ffe600;--on:#000;--nr:#ff3b30;--line:rgba(255,255,255,.1);--muted:rgba(255,255,255,.55);color-scheme:dark;
 --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none}
body{font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:#fff;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.ic{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:none}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{color:var(--accent)}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Kopfzeile: blendet sich aus, Tippen holt sie zurück */
#hdr{position:absolute;z-index:40;top:calc(env(safe-area-inset-top) + 8px);left:calc(env(safe-area-inset-left) + 12px);right:calc(env(safe-area-inset-right) + 12px);display:flex;justify-content:space-between;align-items:center;transition:opacity .4s}
#hdr.off{opacity:0;pointer-events:none}
.hl,.hr{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:rgba(28,28,30,.92);border:1px solid #2c2c2e;font-size:13px;font-weight:600;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.pill .sm{font-size:10px;color:#999}
.round{width:36px;height:36px;border-radius:50%;background:rgba(28,28,30,.92);border:1px solid #2c2c2e;display:grid;place-items:center;font-size:13px;color:#ccc;flex:none}
.menuwrap{position:relative}
.menu{position:absolute;top:44px;left:0;width:240px;max-height:70vh;overflow-y:auto;background:rgba(28,28,30,.97);border:1px solid #2c2c2e;border-radius:18px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;color:#aaa}
.menu button.on{background:#2c2c2e;color:#fff}

/* Bühne und Layouts */
#stage{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);padding:8px;display:flex;justify-content:center}
.L{width:100%;max-width:1600px;display:grid;gap:8px}
.L-single{max-width:1100px}
.L-split{grid-template-columns:1fr 1fr}
.L-grid{grid-template:1fr 1fr/1fr 1fr}
.L-hero{grid-template:"a a" 1fr "b c" 1fr/1fr 1fr}
.L-side{grid-template:"a b" 1fr "a c" 1fr/1.25fr 1fr}
.L-trio{grid-template-columns:1fr 1fr 1fr}
@media (orientation:portrait){
 .L-split{grid-template:1fr 1fr/1fr}
 .L-side{grid-template:"a a" 1.3fr "b c" 1fr/1fr 1fr}
 .L-trio{grid-template:1fr 1fr 1fr/1fr}
}
.slot{position:relative;min-width:0;min-height:0}
.stack{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:30px;scrollbar-width:none}
.stack::-webkit-scrollbar{display:none}
.page{height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.dots{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:5;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}

.card{position:relative;height:100%;width:100%;border-radius:30px;overflow:hidden;padding:18px 20px;display:flex;flex-direction:column;container-type:size;background:#1c1c1e}
.hint{margin:auto;text-align:center;color:var(--muted);font-size:14px;max-width:28ch}
.w-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
.tint{position:absolute;inset:0;background:#ff1e00;mix-blend-mode:multiply;pointer-events:none;opacity:0;z-index:2}
.btn{display:inline-block;padding:10px 16px;border-radius:14px;background:#2c2c2e;font-size:14px;font-weight:600;text-align:center;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on)}

/* Digitaluhr groß (Duo) */
.w-clock-big{background:var(--accent);color:var(--on);justify-content:center;align-items:center;padding:0}
.cb-date{position:absolute;top:7%;left:8%;font-weight:700;font-size:max(13px,4.5cqh);opacity:.6}
.cb-time{display:flex;justify-content:center;gap:7cqw;font:700 min(34cqw,84cqh)/.8 var(--round);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cb-ampm{position:absolute;bottom:7%;right:8%;font-weight:700;opacity:.6}
/* Digitaluhr schwebend */
.w-clock-float{background:#000;color:var(--accent);justify-content:center;align-items:center}
.cf-time{font:300 min(30cqw,70cqh)/.9 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cf-date{font:600 max(13px,5cqh) var(--round);opacity:.8;margin-top:2cqh}
/* Analog */
.w-clock-analog{background:#000;align-items:center;justify-content:center;padding:4%}
.analog{width:min(100cqw,100cqh);height:min(100cqw,100cqh);color:#fff}
/* Weltkarte */
.w-solar{background:#000;padding:16px 18px}
.solar{width:100%;flex:1;min-height:0;color:#fff}

.pop-in{position:relative;width:min(960px,100%);max-height:100%;height:min(720px,100%);overflow-y:auto;background:#121214;border:1px solid #2c2c2e;border-radius:30px;padding:22px;-webkit-user-select:text;user-select:text}
.pop-x{position:sticky;top:0;float:right;z-index:3}
.pop-in h2{font:800 30px/1.05 var(--round);letter-spacing:-.02em;margin-bottom:10px}
.pop-in h3{font:800 18px var(--round);margin:18px 0 8px;color:var(--accent)}
.pop-in p{font-size:14px;line-height:1.4;margin:6px 0}
.pmut{color:var(--muted);font-size:13px}
.px-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.px-temp{font:800 64px/1 var(--round);letter-spacing:-.03em;color:var(--accent)}.px-c{font-size:16px;font-weight:600}.px-ico{font-size:56px}
.px-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.px-grid>div{background:#1c1c1e;border-radius:14px;padding:10px 12px}.px-grid small{display:block;font-size:11px;color:var(--muted)}.px-grid b{font-size:16px}
.px-ch{height:150px}
.pc-e{display:grid;grid-template-columns:5.8em 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);border-left:4px solid var(--c,transparent);padding-left:10px}
.pc-t{font-weight:700;font-variant-numeric:tabular-nums}.pc-t small{display:block;color:var(--muted);font-weight:600}
.pc-b b{font-size:16px;display:block}.pc-b small{display:block;margin-top:2px}.pc-b p{color:#ccc}
.pn{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:#fff;text-decoration:none}.pn small{display:block;color:var(--accent);font-weight:700;font-size:11px}.pn b{font-size:16px;line-height:1.25}
.spp-now{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.spp-now img,.spp-ph{width:min(220px,40%);aspect-ratio:1;border-radius:18px;object-fit:cover;background:linear-gradient(140deg,var(--accent),#000)}
.spp-i{flex:1;min-width:240px}.spp-t{font:800 26px/1.1 var(--round)}.spp-a{color:var(--muted);font-size:15px;margin-top:2px}
.spp-seek{height:6px;border-radius:3px;background:#333;margin-top:14px;cursor:pointer;position:relative}.spp-seek::before{content:"";position:absolute;inset:-10px 0}.spp-seek i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.spp-tm{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.spp-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;max-width:420px}
.spp-ctl button{font-size:20px;padding:8px;color:#ccc;position:relative}.spp-ctl button.on{color:var(--accent)}.spp-ctl .liked svg path{fill:currentColor}
.spp-ctl sup{position:absolute;top:2px;right:0;font-size:9px}
.spp-ctl .pp{width:56px;height:56px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;padding:0}
.spp-vol{display:flex;align-items:center;gap:10px;margin-top:10px;max-width:420px;color:#ccc}.spp-vol input{flex:1;accent-color:var(--accent)}
.spp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 22px;margin-top:6px}
.spp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.spp-row small{color:var(--muted);font-size:12px;flex:none}.btnrow.on{color:var(--accent);font-weight:700}
/* Mengen im Kochmodus */
.srv{display:flex;align-items:center;gap:10px;margin:2px 0 8px}.srv b{font:800 18px var(--round)}
/* Hinweis-Toast */
#toast{position:absolute;z-index:60;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-30px);max-width:min(520px,90%);padding:11px 16px;border-radius:16px;background:rgba(40,40,42,.97);color:#fff;font-size:14px;font-weight:600;line-height:1.3;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* Stil-Bibliothek */
#lib{position:absolute;inset:0;z-index:49;background:#0c0c0e;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 18px)}
.lib-h{font:800 24px var(--round);margin:26px 0 10px;color:var(--accent)}.lib-p{font-size:14px;color:#bbb;line-height:1.45;max-width:70ch;margin:6px 0}
.lib-x{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.lib-x textarea{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:10px;color:#fff;font:12px ui-monospace,Menlo,monospace;margin:6px 0;-webkit-user-select:text;user-select:text}
.lib-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.lib-sw>div{display:grid;grid-template-columns:48px 1fr;column-gap:10px;align-items:center}.lib-sw i{grid-row:1/4;width:48px;height:48px;border-radius:14px}.lib-sw b{font-size:14px}.lib-sw small{font:12px ui-monospace,Menlo,monospace;color:#999}.lib-sw span{font-size:12px;color:#bbb}
.lib-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.lib-f>div{background:#1c1c1e;border-radius:16px;padding:14px;border:2px solid transparent}.lib-f>div.on{border-color:#fff}.lib-f b{display:block;font-size:30px;font-weight:800;line-height:1.1}.lib-f span{font-size:12px;color:#aaa}
.lib-g{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}.lib-g>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12px;color:#aaa}.lib-g i{display:block;border:2px solid var(--accent);border-radius:8px}
.lib-b{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}.lib-b>div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.lib-b small{font-size:12px;color:#aaa}
.lib-w{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.lib-wi{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}.lib-wi .gal-p .card{position:absolute;inset:0;border-radius:20px;pointer-events:none}.lib-d b{display:block;font-size:14px}.lib-d span{font-size:12px;color:#bbb;line-height:1.35}
/* Bearbeiten: Ziehen und Blättern */
body.editing .G>.slot{touch-action:none;cursor:grab}
body.editing .stack{overflow:hidden}
.G>.slot.dragging{z-index:30;cursor:grabbing}.G>.slot.dragging .card{animation:none;transform:scale(1.04);box-shadow:0 18px 40px rgba(0,0,0,.6)}
.ed-pg{position:absolute;right:6px;top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;gap:6px}
.ed-pg button{width:30px;height:30px;border-radius:50%;background:rgba(58,58,60,.96);color:#fff;display:grid;place-items:center;font-size:14px}
.ic.up{transform:rotate(180deg)}
/* Die Gestirne in allen Größen */
.w-gestirne{background:#dcd8cd;color:#111;font-family:'VT323','Courier New',monospace;padding:0}
.gs-box{position:absolute;top:0;left:0;transform-origin:0 0;padding:16px 20px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:18px;row-gap:8px;container-type:size}
/* Rangfolge: Zitat, Urheber kompakt mit Kopf, dann Planeten und Kopfzeile klein */
.gs-top{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:10px;min-width:0}
.gs-hd{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;line-height:1;opacity:.7}
.gs-t{letter-spacing:.14em}.gs-s{letter-spacing:.03em}
.gs-sky{width:72px;height:72px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges}
.gs-box .fitbox.gs-qb{grid-column:1/3;grid-row:2;justify-content:center;margin:0}
.gs-q,.gs-q.fitt{margin:0;font-family:inherit;line-height:1.08;hyphens:none;-webkit-hyphens:none;overflow-wrap:normal}
.gs-who{grid-column:1/3;grid-row:3;display:flex;gap:12px;align-items:center;min-width:0}
.gs-pt{width:42px;height:42px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid currentColor}
.gs-wt{font-size:16px;line-height:1.1;min-width:0}
.gs-n{text-transform:uppercase;letter-spacing:.05em;font-size:18px}
.gs-src{display:block;font-size:13px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* breit (2 × 1, 3 × 2, 4 × 2): Planeten groß links, rechts Titel, Zitat, Urheber mit kleinem Kopf; dieselben Teile wie in allen Größen */
.gs-wide .gs-top{display:contents}
.gs-wide .gs-sky{grid-column:1;grid-row:1/4;align-self:center;width:min(140px,62cqh);height:min(140px,62cqh)}
.gs-wide .gs-hd,.gs-wide .gs-box .fitbox.gs-qb,.gs-wide .gs-who{grid-column:2}
.gs-wide .gs-hd{grid-row:1}
@container (max-width:300px){.gs-s,.gs-src{display:none}}
.gs-wide .gs-s{display:none}
@container (max-height:220px){.gs-hd{display:none}.gs-src{display:none}.gs-pt{width:34px;height:34px}}
@container (min-height:520px){.gs-pt{width:48px;height:48px}.gs-sky{width:84px;height:84px}.gs-n{font-size:20px}.gs-wt{font-size:17px}}
.gs-heads{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.gs-hc{width:72%;height:72%;image-rendering:pixelated;image-rendering:crisp-edges}
/* 1 × 1: nur die Köpfe; erkannt in gsFit, nicht per Container-Abfrage */
.w-gestirne.gs-one .gs-box{display:none}.w-gestirne.gs-one .gs-heads{display:flex}

/* Wetter */
.w-weather{background:linear-gradient(#4a8ad9,#22599f)}
.w-weather.wx-night{background:linear-gradient(#152342,#04070f)}
.w-weather.wx-cloud{background:linear-gradient(#6f7d8e,#3a4552)}
.w-weather.wx-rain{background:linear-gradient(#4d5967,#202730)}
.w-weather.wx-snow{background:linear-gradient(#93a6ba,#56677a)}
.w-weather.wx-storm{background:linear-gradient(#3b3550,#151220)}
.wx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wx-loc{font-size:max(14px,4.6cqh);font-weight:700;opacity:.9}
.wx-temp{font:600 min(36cqh,30cqw)/1 var(--round);letter-spacing:-.03em}
.wx-cond{font-size:max(13px,4.4cqh);font-weight:600}
.wx-ico{font-size:min(20cqh,16cqw);opacity:.95}
.wx-row{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.22)}
.wx-row>div{min-width:0}
.wx-row small{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:300px){.wx-row>div:nth-child(3){display:none}}
.wx-row b{font-size:max(13px,4.4cqh)}
/* Spotify vollflächig */
.w-spotify{background:#121212;padding:0}
.sp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.15) 55%,rgba(0,0,0,.35));z-index:1}
.sp-in{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:16px 18px}
.sp-t{font:800 max(16px,6cqh)/1.1 var(--round)}
.sp-a{font-size:max(13px,4.4cqh);color:rgba(255,255,255,.75)}
.sp-d{font-size:12px;color:#1ed760;margin-top:2px}
.sp-bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;margin:10px 0 6px}
.sp-bar i{display:block;height:100%;background:#fff;width:0}
.sp-ctl{display:flex;justify-content:space-between;align-items:center;padding:0 12%}
.sp-ctl button{font-size:20px;padding:8px}
.sp-ctl .pp{width:48px;height:48px;border-radius:50%;background:#fff;color:#000;font-size:18px;display:grid;place-items:center;padding:0}
.sp-err{font-size:12px;color:#ff8a80;margin-top:4px}
/* Fotos */
.w-photos{padding:0;background:#000}
.pl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.pl.on{opacity:1}
.ph-shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 30%);z-index:1}
.ph-time{position:absolute;top:14px;left:18px;z-index:3;font-size:13px;font-weight:600;opacity:.85}
/* Nachrichten */
.w-news{background:#000;border:1px solid var(--line)}
.nw-big{display:block;color:#fff;text-decoration:none;font:800 20px/1.02 var(--round);letter-spacing:-.025em}
.nw-meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--accent);margin-top:10px}
.nw{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1;min-height:0}
.nw li{padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.06)}
.nw small{display:block;color:var(--accent);font-size:11px;font-weight:700}
.nw a{color:#fff;text-decoration:none;font-size:max(14px,4.6cqh);font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Rezept-Kachel */
.w-recipe{padding:0;background:var(--bg);color:var(--fg)}
.rk-in{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:7% 8%}
.rk-c{font-size:max(12px,4.4cqh);font-weight:800;opacity:.75}
.rk-t{font:800 24px/.92 var(--round);letter-spacing:-.04em}
.fitbox{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.fitbox.mid{justify-content:center}
.fitbox.fade{justify-content:flex-start;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.fitt{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;padding-bottom:.14em}
.rk-m{font-size:max(12px,4.2cqh);font-weight:600;opacity:.7;margin:3% 0 5%}
.rk-b{display:flex;gap:8px;align-items:center}
.go{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:800;font-size:15px}
.ghost{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 14%,transparent);color:var(--fg)}
.w-recipe img,.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.w-recipe .shade,.rc .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.1) 65%);z-index:1}

/* Rezept-Bibliothek */
.hub{width:100%;max-width:1600px;overflow-y:auto;padding:52px 6px 20px}
.hub-top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.hub h1{font:800 clamp(40px,9vw,110px)/.85 var(--round);letter-spacing:-.05em;margin-right:auto;color:var(--accent)}
.hub input{background:#1c1c1e;border:0;border-radius:99px;padding:10px 16px;font-size:16px;width:min(260px,100%)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:99px;background:#1c1c1e;font-size:14px;font-weight:700;color:#bbb}
.chips button.on{background:var(--accent);color:var(--on)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;grid-auto-flow:dense}
.rc{position:relative;aspect-ratio:1;border-radius:26px;overflow:hidden;text-align:left;display:flex;flex-direction:column;padding:9%;container-type:inline-size;background:var(--bg);color:var(--fg)}
.rc.big{grid-column:span 2;grid-row:span 2}
.rc .k,.rc b,.rc .meta{position:relative;z-index:3}
.rc .k{font-size:max(11px,6.4cqw);font-weight:800;opacity:.75}
.rc b{display:block;font:800 18px/.92 var(--round);letter-spacing:-.04em}
.rc .fitbox{position:relative;z-index:3;margin-top:4%}
.rc .meta{font-size:max(11px,5.6cqw);font-weight:600;opacity:.7;margin-top:6%}
.rc.big .k,.rc.big .meta{font-size:max(12px,3.6cqw)}

/* Kochmodus: große Typografie, ein Schritt pro Seite */
#cook{position:absolute;inset:0;z-index:45;background:var(--bg);color:var(--fg);overflow:hidden}
.ck-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4}
.ck-wrap{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 18px)}
.ck-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ck-title{font:800 clamp(15px,2.2vw,22px)/1.1 var(--round);letter-spacing:-.01em;min-width:0}
.ck-title small{display:block;font:600 12px -apple-system,sans-serif;opacity:.65;margin-top:2px}
.ck-top .r{display:flex;gap:6px;align-items:center;flex:none}
.cbtn{height:38px;padding:0 14px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--fg) 13%,transparent);color:var(--fg);cursor:pointer}
.cbtn.sq{width:38px;padding:0;justify-content:center}
.cbtn.on{background:var(--fg);color:var(--bg)}
.ck-main{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,3vw,48px);align-items:center;padding:8px 0}
.ck-num{font:800 min(42vh,24vw)/.78 var(--round);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.ck-of{font:700 clamp(13px,2.6vh,20px) var(--round);opacity:.6;margin-top:10px}
.ck-g{font-size:13px;font-weight:800;opacity:.7;margin-bottom:8px}
.ck-text{font:700 24px/1.16 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.015em;-webkit-user-select:text;user-select:text;hyphens:auto}
.ck-step{min-height:0;height:100%;display:flex;flex-direction:column}
@media (orientation:portrait){.ck-main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.ck-num{font-size:min(24vh,46vw)}}
.ck-bar{display:flex;align-items:center;gap:12px}
.seg{display:flex;gap:4px;flex:1;min-width:0}
.seg button{flex:1;min-width:0;height:28px;position:relative;padding:0}
.seg button::after{content:"";position:absolute;left:0;right:0;top:11px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--fg) 18%,transparent)}
.seg button.done::after{background:color-mix(in srgb,var(--fg) 55%,transparent)}
.seg button.on::after{background:var(--fg)}
.nav{width:clamp(48px,6.5vw,72px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;border:2.5px solid var(--fg);color:var(--fg)}
.nav.next{background:var(--fg);color:var(--bg)}
.nav:disabled{opacity:.2}
.ck-lock{font-size:12px;font-weight:700;opacity:.7;display:flex;align-items:center;gap:5px}
.drawer{position:absolute;z-index:7;top:calc(env(safe-area-inset-top) + 60px);right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(400px,calc(100% - 24px));background:var(--bg);color:var(--fg);border:2px solid color-mix(in srgb,var(--fg) 25%,transparent);border-radius:26px;padding:18px 20px;overflow-y:auto;-webkit-user-select:text;user-select:text;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.drawer h3{font:800 26px/1 var(--round);letter-spacing:-.03em;margin:16px 0 6px}
.drawer h3:first-child{margin-top:0}
.drawer h4{font-size:13px;font-weight:800;opacity:.7;margin:14px 0 2px}
.drawer ul{list-style:none}
.drawer li{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 15%,transparent);font-size:16px;font-weight:600}
.drawer p{font-size:13px;opacity:.75;margin-top:12px;white-space:pre-wrap}
.drawer a{color:inherit;font-weight:700}
.un-f{display:flex;gap:6px;margin:10px 0}
.un-f input{flex:1;min-width:0;background:color-mix(in srgb,var(--fg) 10%,transparent);border:0;border-radius:99px;padding:9px 14px;color:var(--fg);font-size:16px}
.un-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.cred{font-size:11px;opacity:.75}.cred a{color:inherit}

/* Einstellungen */
#modal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px)}
.sheet{width:100%;max-width:600px;max-height:100%;overflow-y:auto;background:#161618;border:1px solid #2c2c2e;border-radius:28px;padding:18px}
.sheet h2{font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sec{padding:14px;border-radius:18px;background:#1f1f22;border:1px solid #2c2c2e;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{font-size:12px;color:#999;font-weight:600}
.sec input[type=text],.sec input[type=url],.sec select{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:10px 12px;font-size:16px}
.sec p{font-size:12px;color:#999;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#333;color:#ccc}
.badge.ok{background:#14532d;color:#bbf7d0}
.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.themes button{padding:8px 0;border-radius:12px;border:1px solid #2c2c2e;background:#1a1a1c;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px}
.themes button.on{border-color:#fff}
.themes i{width:22px;height:22px;border-radius:50%}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.tog input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.tog input[type=time]{background:#111;border:1px solid #333;border-radius:10px;padding:6px 8px;color:#fff;font-size:16px}
.sec textarea{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:10px 12px;font-size:16px;color:#fff;font-family:inherit;-webkit-user-select:text;user-select:text;resize:vertical}
.wc-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wc-row label{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#2c2c2e;font-size:13px;font-weight:600}
.wc-row input{width:16px;height:16px;accent-color:var(--accent)}
.fonts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fontb{padding:10px;border-radius:14px;background:#232326;border:2px solid transparent;text-align:left}
.fontb.on{border-color:#fff}.fontb b{display:block;font-size:24px;line-height:1}.fontb span{font-size:11px;color:#aaa}
.tog select{width:auto}
.de{border:1px solid #333;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.de-row{display:flex;gap:6px}
.de-row input{flex:1}
.de-row select{flex:1}
.de-slot{font-size:12px;color:#999;font-weight:600;margin-top:2px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:99px;background:#2c2c2e;font-size:13px}
.wchip button{width:22px;height:22px;border-radius:50%;background:#3a3a3c;font-size:10px}
.wchips select{width:auto;padding:5px 8px;border-radius:99px;font-size:13px}

/* Nachtmodus: schwarz, Schrift und Linien rot, Bilder rot eingefärbt */
body.night{--accent:#ff3b30;--on:#000;--tint:#5c0d08;--tint-ink:var(--nr)}
body.night .w-analog-solid{--on:var(--nr)}
body.night .cx-h,body.night .cx-m{background:transparent!important}
body.night .now .wk-h b{background:var(--nr)!important;color:#000!important}
body.night .card{background:#000!important;border:1px solid #2a0805}
body.night .card,body.night .card *{color:var(--nr)!important}
body.night .card img,body.night #cook img{filter:grayscale(1) contrast(1.1)}
body.night .tint{opacity:1}
body.night .cal-g .today em{background:var(--nr)!important;color:#000!important}
body.night .ag li::before{background:var(--nr)}
body.night .sp-ctl .pp,body.night .btn,body.night .nw li{background:#260604!important}
body.night .sp-bar{background:#3a0b07}
body.night .sp-bar i,body.night .dots i.on{background:var(--nr)}
body.night .dots i{background:#3a0b07}
body.night .wx-row{border-color:#3a0b07}
body.night #hdr,body.night #hdr *{color:var(--nr)!important}
body.night #cook,body.night .rc,body.night .w-recipe{--bg:#000!important;--fg:var(--nr)!important}
body.night #cook,body.night #cook *{color:var(--nr)!important}
body.night .nav.next,body.night .cbtn.on{color:#000!important}
body.night .rc,body.night .w-recipe{border:1px solid #2a0805}
body.night .hub,body.night .hub *{color:var(--nr)!important}
body.night .chips button{background:#0d0201!important}
body.night .chips button.on{background:var(--nr)!important;color:#000!important}

/* 3.0.1: kleinste Kachel (1 × 1) zeigt weniger statt alles zu verkleinern */
.w-head .lg{font-style:normal}
@container (max-width:240px) and (max-height:240px){
 .w-cal-agenda .ag li:nth-child(n+3),.w-agenda .ag li:nth-child(n+4){display:none}
 .w-cal-agenda .ag,.w-agenda .ag{-webkit-mask-image:none;mask-image:none}
 .wi-y small{display:none}
}
/* schmale Kacheln (1 × 1 und 1 × 2) */
@container (max-width:240px){
 .w-head .lg,.w-forecast .w-head span+span,.w-wiki .w-head span+span{display:none}
 .w-cal-agenda .ag li,.w-agenda .ag li{min-width:0}
 .w-cal-agenda .ag .trunc,.w-agenda .ag .trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .sl-row b{font-size:min(22px,12cqw)}
}
/* Uhren bleiben kreisrund, auch wenn Safari das Flex-Element staucht */
.analog{flex:none;max-width:100%;max-height:100%}

/* 3.0.1: Spotify-Fenster, Cover nie beschnitten, Warteschlange einzeilig */
.spp-now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.spp-now img,.spp-ph{width:min(200px,36vw,calc(100dvh - 150px));min-width:110px}
.spp-i{min-width:0}
.spp-t,.spp-a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spp-q{flex-direction:column;align-items:stretch;gap:1px}
.spp-q b,.spp-q small{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.spp-q small{font-weight:500}
@media (max-width:560px){.spp-now{grid-template-columns:1fr}.spp-now img,.spp-ph{width:min(220px,60vw)}}

/* 3.0.1: Diagramme verständlich, Legenden */
.ch{position:relative}
.ch-now{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #000}
.ch-lab{position:absolute;transform:translate(-50%,-135%);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.ch-lab.lo{transform:translate(-50%,35%)}
.ch-key{display:inline-block;width:7px;height:10px;margin-right:4px;background:var(--pop);opacity:.6;border-radius:1px}
.fc-d{grid-template-columns:3.6em 1.4em 3em 1fr 4.6em}
.fc-lg{display:flex;gap:14px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:4px;flex:none}
.fc-lg b{color:var(--pop);font-weight:700}
.fc-lg i{display:inline-block;width:18px;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:2px}
@container (max-width:250px){.fc-d{grid-template-columns:3.3em 1.3em 1fr auto}.fc-lg span+span{display:none}}
@container (max-height:260px){.fc-lg{display:none}}
@container (min-aspect-ratio: 3/2){.fc-lg{display:none}.w-forecast .fc-d{grid-template-columns:1fr}}
@container (max-aspect-ratio: 3/4){.w-temp-chart .ch,.w-wx-combo .ch{flex:0 0 42cqh;margin-top:auto}}

/* Spotify-Widget nach den Spotify-Richtlinien (Entwurf 3.1.0) */
.sp2{height:100%;display:flex;flex-direction:column;gap:12px;padding:16px 18px;position:relative}
.sp2-cov{display:block;flex:none;width:min(46cqw,42cqh);aspect-ratio:1;border-radius:6px;overflow:hidden;background:#282828}
.sp2-cov img{width:100%;height:100%;object-fit:cover;display:block}
.sp2-i{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0}
.sp2-top{position:absolute;top:16px;right:18px;display:flex;align-items:center;gap:8px;max-width:50%}
.sp-logo{width:24px;height:24px;color:#1ed760;flex:none}
.sp2 .sp-dv{background:#2a2a2a;max-width:100%}
.sp2-meta{margin-top:auto;min-width:0}
.sp2-l{font-size:12px;color:#b3b3b3;margin-bottom:2px}
.sp2-t,.sp2-a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit;text-decoration:none}
.sp2-t{font:800 max(16px,min(7cqh,8cqw))/1.15 var(--round)}
.sp2-t{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.sp2-a{font-size:max(13px,min(4.6cqh,5.5cqw));color:#b3b3b3;margin-top:2px}
.sp2 .sp-ctl{padding:0;justify-content:space-around}
.sp2 .sp-bar{margin:8px 0 4px}
/* breit: Cover links in voller Höhe */
@container (min-aspect-ratio: 3/2){.sp2{flex-direction:row;gap:16px}.sp2-cov{width:auto;height:100%}.sp2-top{position:static;max-width:100%;justify-content:space-between}.sp2-i{position:relative}}
/* 1 × 1: Cover, Logo, Titel und Interpret; Steuerung im Detailfenster */
@container (max-width:240px) and (max-height:240px){.sp2{gap:8px;padding:14px}.sp2-cov{width:52cqw}.sp2-top{top:14px;right:14px}.sp2 .sp-dv,.sp2 .sp-ctl,.sp2 .sp-bar,.sp2-l{display:none}.sp2-t{font-size:15px;-webkit-line-clamp:1}.sp2-a{font-size:12px}}
/* schmal und hoch: Cover über die Breite */
@container (max-width:240px) and (min-height:300px){.sp2-cov{width:100%}.sp2-top{position:static;order:-1;justify-content:space-between;max-width:100%}.sp2 .sp-ctl{margin-top:6px}}

/* 3.1.1: Kurven um jetzt, Vergangenheit blass */
.ch-nl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed color-mix(in srgb,currentColor 35%,transparent)}
.ch-xn{color:var(--accent);font-weight:700}

/* 3.1.1: Vorhersage nennt die gezeigte Anzahl Tage; Drei Tage lesbar */
.fc-n7,.fc-n3{font-style:normal}.fc-n3{display:none}
@container (max-height:260px){.fc-n7{display:none}.fc-n3{display:inline}}
.wk-h b{font-size:max(16px,min(8cqh,9cqw))}
.wk-h span{font-size:12px}
.wk-e{font-size:max(11px,min(4cqh,5cqw));padding:4px 6px}

/* 3.1.1: Spotify-Fenster ruhiger, Reiter statt vier Spalten, kein sichtbarer Scrollbalken */
.pop-in{scrollbar-width:none}.pop-in::-webkit-scrollbar{display:none}
.spp-cov{display:block;border-radius:8px;overflow:hidden;aspect-ratio:1;width:min(180px,32vw,calc(100dvh - 190px));min-width:96px;background:#282828}
.spp-cov img{width:100%;height:100%;object-fit:cover;display:block}
.spp-now .spp-cov img{width:100%;height:100%;min-width:0;border-radius:0}
.spp-now .spp-cov.spp-ph{border-radius:8px}
@media (max-width:560px){.spp-cov{width:min(220px,60vw)}}
.spp-on{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px;text-align:left;max-width:100%}
.spp-on .sp-logo{width:20px;height:20px}
.spp-on b{color:#fff}
.spp-on span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.spp-t,a.spp-a{display:block;color:inherit;text-decoration:none}
.spp-a{color:var(--muted)}
.spp-tabs{margin:18px 0 6px;flex-wrap:nowrap}
.spp-list{display:flex;flex-direction:column}
.spp-list .spp-row{display:flex;align-items:center;gap:12px;padding:8px 0;justify-content:flex-start;width:100%;text-align:left}
.spp-list .spp-row img,.spp-noimg{width:40px;height:40px;border-radius:4px;object-fit:cover;flex:none;background:#2a2a2a;display:block}
.spp-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#2a2a2a;flex:none;font-style:normal}
.spp-list .spp-row span{display:flex;flex-direction:column;min-width:0;flex:1}
.spp-list .spp-row b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spp-list .spp-row small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spp-list .spp-row.on b{color:#1ed760}

/* Drei Tage schmal: Tage untereinander, Tag als Zeile über den Einträgen, Titel in voller Breite */
@container (max-width:240px){
 .wk{grid-template-columns:1fr;grid-auto-rows:min-content;gap:8px}
 .wk-d{gap:3px}
 .wk-h{flex-direction:row;align-items:baseline;gap:6px;margin:0}
 .wk-h b{font-size:13px;width:auto;height:auto;padding:1px 6px;border-radius:99px}
 .wk-e{font-size:12px}
 .wk-more{text-align:left}
}
@container (max-width:240px) and (max-height:240px){.wk-d .wk-e:nth-of-type(n+4){display:none}.wk-d:nth-child(3){display:none}}

/* Über und Quellen */
.ab-r{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:8px 0;border-bottom:1px solid var(--line)}
.ab-r a{color:inherit;text-decoration:none}.ab-r a b{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.ab-r span{font-size:13px;color:#ccc}.ab-r small{font-size:12px;color:var(--muted)}
.pop-in .src a{color:inherit}

.pal-c .hex{width:100%;height:auto;padding:7px 6px;border-radius:10px;background:#1c1c1e;border:1px solid #333;color:#fff;font:600 13px ui-monospace,Menlo,monospace;text-align:center;cursor:text}

/* 3.2.0: Fotos einzeln löschen, Rezepte-Liste */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0 10px}
.ph-grid div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#222}
.ph-grid img{width:100%;height:100%;object-fit:cover;display:block}
.ph-grid button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center;font-size:12px}
.rec-l{margin-top:8px}.rec-l summary{cursor:pointer;font-weight:700;padding:6px 0}
.rec-l div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rec-l span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sm{padding:5px 12px;font-size:12px;flex:none}
.sheet select{max-width:100%;min-width:0}.tog select{max-width:62%}

/* iOS zoomt bei Eingabefeldern unter 16 px hinein, das Fenster wackelt dann seitlich */
input:not([type=checkbox]):not([type=range]):not([type=color]),select,textarea{font-size:max(16px,1em)}
.sheet,#pal,.pop-in{overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
.pal-c .hex{font-size:16px}

/* Radio-Sender bearbeiten */
.rd-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rd-r span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.round.sm{width:30px;height:30px;font-size:13px;flex:none}
.rd-s{flex-wrap:wrap;margin:0}
.rd-add{display:grid;gap:8px}
/* Rezept-Widget als Vollbild: Rezepte-Übersicht in der Kachel */
.w-hubcard{padding:0;background:#000}
.w-hubcard .hub{height:100%;max-width:none;padding:14px 16px 20px}
@media (orientation:landscape){.w-hubcard .hub{padding-top:56px}}

/* 4.0: Kontextmenü, Widget-Blatt, groß anzeigen */
#ctx{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ctx-in{position:absolute;min-width:230px;background:rgba(40,40,44,.96);border:1px solid #3a3a3c;border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.ctx-in b{font-size:12px;color:var(--muted);padding:8px 12px 6px;font-weight:600}
.ctx-in button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:16px;text-align:left}
.ctx-in button:active{background:#3a3a3c}
.ws h2{display:flex;justify-content:space-between;align-items:center}
.ws .sec{margin:0}.btnrow.cty span{display:flex;flex-direction:column}.btnrow.cty small{color:var(--muted)}
#big{position:fixed;inset:0;z-index:55;background:#000;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px)}
#big .big-card{height:100%;width:100%}
.big-x{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:calc(env(safe-area-inset-right) + 18px);z-index:3}
.nodate .cb-date,.nodate .cf-date,.nodate .cs-d,.nodate .co-d,.nodate .fl-d{display:none}

.ed-rs{position:absolute;right:-6px;bottom:-6px;z-index:8;min-width:44px;height:30px;padding:0 10px 0 22px;border-radius:99px;background:rgba(58,58,60,.96);color:#fff;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:none;cursor:nwse-resize}
.ed-rs::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-right:2px solid #fff;border-bottom:2px solid #fff}
.sec input[type=search]{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:10px 12px;font-size:16px;color:#fff;-webkit-appearance:none;appearance:none}
/* 4.1: Laufband mehrzeilig */
.tk2{position:absolute;inset:40px 0 10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tk2-r{overflow:hidden;white-space:nowrap;font-size:min(12cqh,10cqw);line-height:1.05}
.tk2 .tk-run{font:800 1em/1.05 var(--round);letter-spacing:-.02em}
.tk2-r.r1 .tk-run{font-weight:400;opacity:.85}
.tk2-r.r2{-webkit-text-stroke:1.2px currentColor}.tk2-r.r2 .tk-run{-webkit-text-fill-color:transparent}
.tk2-r.rev .tk-run{animation-direction:reverse}
.tk2 .tk-run i{font-size:1em;opacity:.35;font-weight:300}
.tk2-r:nth-child(n+6){display:none}
@container (max-aspect-ratio: 3/4){.tk2-r:nth-child(n+6){display:block}.tk2-r{font-size:min(7cqh,13cqw)}}
@container (min-height:300px) and (min-aspect-ratio: 3/4){.tk2-r:nth-child(n+6){display:block}.tk2-r{font-size:min(7.5cqh,9cqw)}}
/* 4.1: Schlagzeilen-Übersicht */
.hdl{list-style:none;display:flex;flex-direction:column;gap:2px;margin-top:8px;flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent);counter-reset:hdl}
.hdl li{counter-increment:hdl;border-bottom:1px solid var(--line);padding:6px 0}
.hdl a{display:grid;grid-template-columns:1.4em 1fr;column-gap:6px;color:inherit;text-decoration:none}
.hdl a::before{content:counter(hdl);grid-row:1/3;color:var(--accent);font:800 max(13px,min(4.5cqh,5cqw))/1.25 var(--round)}
.hdl b{font-weight:700;font-size:max(13px,min(4.6cqh,5.2cqw));line-height:1.25;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.hdl small{font-size:11px;color:var(--muted);margin-top:1px}
/* 4.1: Detailfenster ruhiger */
#pop .pop-in{animation:popIn .22s cubic-bezier(.2,.8,.2,1);padding:26px 28px 30px;background:#111113;border-color:#262628}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.985)}}

.pop-in h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 6px}

.dots{transition:opacity .5s}body.dz .dots{opacity:0}

.pc-e{grid-template-columns:5.8em minmax(0,1fr)}

.dt-s{font:700 max(18px,min(15cqh,12cqw))/1 var(--round);margin-top:4px}

const RECIPES0=[{"id": "beispiel-dal", "t": "Rotes Linsen-Dal mit Kokos", "c": ["Hauptgerichte", "Suppen & Eintöpfe"], "tags": ["Beispiel", "Vegan", "Indisch"], "sv": "4 Portionen", "prep": 10, "cook": 25, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["1 Zwiebel", "2 Knoblauchzehen", "1 Stück Ingwer (ca. 3 cm)", "2 EL Öl", "1 TL Kreuzkümmel", "2 TL Currypulver", "1 TL Kurkuma", "250 g rote Linsen", "1 Dose Kokosmilch (400 ml)", "1 Dose gehackte Tomaten (400 g)", "500 ml Gemüsebrühe", "1 Limette", "Salz", "½ Bund Koriander"]]], "st": [["", ["Zwiebel, Knoblauch und Ingwer fein hacken.", "Öl in einem Topf erhitzen und die Zwiebel darin etwa 5 Minuten glasig dünsten.", "Knoblauch, Ingwer und die Gewürze dazugeben und 1 Minute anrösten.", "Linsen abspülen und mit Kokosmilch, Tomaten und Brühe in den Topf geben.", "Aufkochen und etwa 20 Minuten leise köcheln lassen, bis die Linsen weich sind.", "Mit Salz und Limettensaft abschmecken und mit gehacktem Koriander bestreuen."]]], "notes": "Dazu passen Reis oder Fladenbrot.", "src": {"n": "Beispielrezept", "a": "", "u": ""}}, {"id": "beispiel-kuchen", "t": "Zitronen-Joghurt-Kuchen mit Glasur", "c": ["Backen", "Desserts & Süßes"], "tags": ["Beispiel", "Vegetarisch", "Klassiker"], "sv": "1 Kastenform", "prep": 15, "cook": 50, "rest": 30, "total": null, "diff": "leicht", "ing": [["Teig", ["2 Bio-Zitronen", "3 Eier", "180 g Zucker", "1 Prise Salz", "150 g Naturjoghurt", "120 ml neutrales Öl", "250 g Mehl", "2 TL Backpulver"]], ["Glasur", ["150 g Puderzucker", "3 EL Zitronensaft"]]], "st": [["", ["Backofen auf 175 °C Ober-/Unterhitze vorheizen und eine Kastenform einfetten.", "Zitronen heiß waschen, die Schale fein abreiben und den Saft auspressen.", "Eier, Zucker und Salz schaumig schlagen, dann Joghurt, Öl, Zitronenschale und 3 EL Zitronensaft unterrühren.", "Mehl und Backpulver mischen und kurz unterheben.", "Den Teig in die Form füllen und 45–50 Minuten backen, bis an einem Holzstäbchen kein Teig mehr kleben bleibt.", "Den Kuchen 10 Minuten in der Form abkühlen lassen, dann stürzen.", "Puderzucker mit dem restlichen Zitronensaft glatt rühren und über den lauwarmen Kuchen gießen."]]], "notes": "", "src": {"n": "Beispielrezept", "a": "", "u": ""}}, {"id": "rmut40uq3q6lo6", "t": "Gebackener Blumenkohl mit Harissa-Pilaw", "c": ["Hauptgerichte"], "tags": ["Vegetarisch", "Modern"], "sv": "4 Portionen", "prep": 10, "cook": 35, "rest": 10, "total": null, "diff": "leicht", "ing": [["für den Blumenkohl", ["2 rote Zwiebeln (geschält, in feine Scheiben geschnitten)", "1 Blumenkohl (1,1 kg, geputzt, in 4 cm große Röschen geschnitten)", "6 EL Sonnenblumenöl", "2½2 TL Kreuzkümmel (gemahlen)", "2½2 TL Kashmiri-Chili (gemahlen, oder mildes Chilipulver)", "2 TL Kurkuma (gemahlen)", "2 TL feines Meersalz"]], ["für den Reis", ["350 g Basmati-Reis (ungewaschen)", "4 EL Sonnenblumenöl", "4 EL Rosenharissa-Paste", "2 x 2 cm großes Stück frischer Ingwer (geschält, gerieben)", "11/2 TL feines Meersalz", "700 ml Wasser"]], ["für das Topping", ["3 EL Zitronensaft", "20 g Minze (Blätter abgezupft, fein gehackt)", "20 g Koriander (Blätter und zarte Stängel fein gehackt)", "60 g Cashewkerne (geröstet, fein gehackt)"]]], "st": [["", ["Den Ofen auf 240 Grad (220 Grad Umluft) vorheizen.", "In einer großen Auflaufform die fein geschnittenen Zwiebeln und den Blumenkohl vermengen, dann Öl, Gewürze und Salz hinzugeben und alles gleichmäßig miteinander vermengen.", "Die Form fest mit Alufolie abdecken und an den Rändern andrücken, dann beiseitestellen.", "Wasser in einem Topf oder Wasserkocher aufkochen.", "Reis, Öl, Harissa, Ingwer, Salz und das frisch abgekochte Wasser in eine zweite große Auflaufform geben.", "Auch diese mit Folie abdecken, gut verschließen und an den Rändern fest andrücken.", "Beide Auflaufformen 25 Minuten lang backen, dabei nach der Hälfte der Backzeit einmal vorsüchtig drehen.", "Beide Formen aus dem Ofen nehmen und die Reisform mit dem Foliendeckel beiseitestellen und ruhen lassen.", "Die Folie von der Blumenkohlform abnehmen und den Kohl für zehn Minuten zurück in den Ofen schieben, damit er knusprig wird.", "Nach zehn Minuten die Alufolie vom Reis abnehmen und die Blumenkohl-Zwiebel- Mischung darauf verteilen.", "Mit dem Zitronensaft beträufeln, mit gehackten Kräutern und Cashewnüssen bestreuen und warm servieren."]]], "notes": "", "src": {"n": "Zeit Magazin Wochenmarkt", "a": "", "u": ""}}, {"id": "rmut4y8o5e5kql", "t": "Pasuts Tolma", "c": ["Hauptgerichte", "Vorspeisen & Snacks"], "tags": ["Vegan", "Armenisch", "Vegetarisch"], "sv": "6 Portionen", "prep": 60, "cook": 45, "rest": 720, "total": null, "diff": "mittel", "ing": [["", ["250 g Langkornreis", "250 g Tellerlinsen (oder Berglinsen)", "3 Zwiebeln", "3 EL Olivenöl", "200 g Tomatenmark", "1 TL Salz", "½TL schwarzer Pfeffer aus der Mühle", "1 TL edelsüßes Paprikapulver", "1 Knoblauchzehe", "1 Dose Kidneybohnen (Abtropfgewicht 255 g)", "1 Dose Kichererbsen (Abtropfgewicht 265 g)", "1 Bund Koriander", "1 Bund Petersilie", "1 Kopf Weißkohl"]]], "st": [["", ["Tellerlinsen und Reis jeweils in eine Schüssel geben, mit Wasser bedecken und 12 Stunden oder über Nacht einweichen lassen.", "Zwiebeln fein würfeln und mit reichlich Olivenöl glasig anbraten.", "Tomatenmark dazugeben, mit Salz, Pfeffer und Paprikapulver würzen und gut vermischen.", "Knoblauch fein hacken, dazugeben und kurz anbraten lassen.", "Reis und Linsen in separaten Sieben abtropfen lassen und zunächst den Reis in einen großen Topf geben.", "Mit etwa 1 l Wasser aufgießen und zum Kochen bringen.", "Nach etwa 10 Minuten die Linsen unterrühren und gemeinsam für etwa 20 weitere Minuten garen lassen.", "Kidneybohnen und Kichererbsen gemeinsam mit den gebratenen Zwiebeln zur Reis-Linsen-Mischung geben.", "Alles gut miteinander vermengen.", "Koriander und Petersilie fein hacken und dazugeben.", "Mit Salz und Pfeffer großzügig würzen.", "Die Befüllung der Weißkohlblätter bei Pasuts Tolma erfolgt analog zur Befüllung der Weißkohlblätter bei
