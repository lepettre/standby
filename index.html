: ["Vegetarisch", "Italienisch"], "sv": "12 Bällchen", "prep": 12, "cook": 30, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["2 Fenchelknollen (mittelgroß)", "Salz", "1 Ei", "1 Prise Muskatnuss (frisch gerieben)", "150 g Ricotta", "1 EL Petersilie (gehackt)", "80 g Semmelbrösel (plus 2 EL mehr)", "Pfeffer", "Olivenöl"]]], "st": [["", ["Die äußeren Schichten der Fenchelknollen entfernen, Knollen waschen und vierteln.", "In leicht gesalzenem Wasser ungefähr 15 Minuten lang bei mittlerer Temperatur mit geschlossenem Deckel kochen.", "Abgießen, abkühlen lassen, mit dem Pürierstab pürieren.", "Die Fenchelmasse im Sieb noch mal abtropfen lassen.", "Dann in eine Schüssel geben, Ei, noch mal Salz, Muskatnuss und Ricotta dazugeben und alles vermengen.", "Petersilie unterheben.", "Nach und nach die Semmelbrösel dazugeben, bis ein glatter, kompakter Teig entsteht (eventuell nimmt man etwas mehr als in der Zutatenliste angegeben).", "Den Teig mit Salz und Pfeffer abschmecken.", "Mit den Händen kleine Kugeln formen.", "2 EL Semmelbrösel auf einem Teller verteilen, die Fenchelbällchen darin wälzen, sodass sie von allen Seiten mit Bröseln bedeckt sind.", "Ein Backblech mit Backpapier auslegen, den Boden mit etwas Olivenöl einfetten.", "Die Bällchen daraufgeben.", "Noch mal etwas Olivenöl darüberträufeln.", "Im 200 Grad (Umluft) heißen Ofen 15 Minuten lang backen.", "Nach der Hälfte der Garzeit die Bällchen wenden."]]], "notes": "", "src": {"n": "Zeit Magazin Wochenmarkt, Herbst 2026", "a": "", "u": ""}}, {"id": "rmut6tfzgem9yz", "t": "Borschtsch", "c": ["Suppen & Eintöpfe", "Hauptgerichte"], "tags": ["Vegetarisch", "Osteuropäisch"], "sv": "4 Portionen", "prep": null, "cook": 30, "rest": null, "total": null, "diff": "", "ing": [["", ["2 Karotten", "2 Zwiebeln etwas Olivenöl", "2–3 Knoblauchzehen, klein gehackt", "1 Glas eingelegte Rote Bete oder 3 frische Bete samt Grün", "2 EL Tomatenmark", "100-200 g Sauerkraut", "1-1½ Liter Gemüsebrühe", "300 g Kartoffeln (festkochend), geschält und gewürfelt", "2 Lorbeerblätter", "1 EL Zucker", "Salz frisch gemahlener schwarzer", "Pfeffer", "Essigessenz (optional)", "Petersilie, Dill und Schmand zum Garnieren"]]], "st": [["", ["Die Karotten reiben, die Zwiebel abziehen und würfen und zusammen mit den Karotten in etwas Olivenöl in einem Topf anschwitzen.", "Den Knoblauch abziehen und fein hacken.", "Die Rote Bete zusammen mit Tomatenmark, Knoblauch und Sauerkraut dazugeben und etwa 5 Minuten zusammen dünsten.", "Mit der Brühe aufgießen, Kartoffeln und Lorbeerblätterhinzufügen, die Suppe zum Kochen bringen und 20–30 Minuten oder bis die Kartoffeln weich sind, gar ziehen lassen.", "Mit Zucker, Salz, Pfeffer und nach Belieben mit einem Spritzer Essigessenz abschmecken.", "Zusammen mit Petersilie, Dill und einem Klecks Schmand auf den Tellern anrichten und heiß servieren.", "Mit Schmand und klein geschittenen Kräutern wie Dil und Petersilie anrichten, nach Wunsch mi Essig verfeinern."]]], "notes": "Fall frische Bete verwendet wird, die Kochzeit um 10 Minuten und entsprechend die Kartoffeln mitgaren.\n\nDas Grün der Bete kann im Ganzen mitgekocht werden und verleiht der Suppe eine kräftigere Farbe und eine besondere Süße.", "src": {"n": "", "a": "", "u": ""}}, {"id": "rmut870vmqfzxf", "t": "Scherennudeln mit cremiger Kimchi-Soße", "c": ["Hauptgerichte"], "tags": ["Vegan", "Asiatisch", "Pasta/Nudeln"], "sv": "2 Portionen", "prep": 5, "cook": 15, "rest": 15, "total": null, "diff": "leicht", "ing": [["", ["200 g Naturtofu", "85 ml Wasser", "250 g Weizenmehl Type 405", "1/2 TL Salz", "2 Frühlingszwiebeln", "1 EL Rapsöl", "2 EL Tomatenmark", "160 g Kimchi", "150 ml Hafersahne", "1 EL gerösteter Sesam"]]], "st": [["", ["Tofu mit Wasser und Salz cremig pürieren.", "Mit dem Mehl 5 Minuten zu einem gleichmäßigen Teig verkneten.", "Abgedeckt 15 Minuten im Kühlschrank ruhen lassen.", "Frühlingszwiebel in Ringe schneiden, Grün beiseite stellen.", "Kimchi grob hacken.", "Teig mit der Schere in ca. 3 cm lange Nudeln direkt in kochendes Salzwasser schneiden.", "6-8 Minuten bei mittlerer Hitze garen.", "Den weißen Teil der Frühlingszwiebel 1 Minute im Öl anschwitzen.", "Tomatenmark dazu und anrösten.", "Kimchi dazu, kurz scharf anbraten, mit Hafersahne ablöschen.", "Bei niedriger Hitze köcheln lassen, bis die Nudeln gar sind.", "Nudeln tropfnass in die Sauce geben, bei Bedarf mit Salz abschmecken.", "Mit Frühlingszwiebelgrün und Sesam toppen."]]], "notes": "", "src": {"n": "", "a": "Eat this", "u": ""}}, {"id": "rmut92wy26tflp", "t": "Dinkelbrötchen mit Bärlauch", "c": ["Backen", "Frühstück"], "tags": ["Vegetarisch", "Brötchen"], "sv": "", "prep": null, "cook": 30, "rest": 720, "total": null, "diff": "", "ing": [["", ["200 g Dinkelmehl", "100 g Dinkelvollkornmehl", "6 g Salz", "3 g frische Hefe (oder 1,2 g Trockenhefe)", "230 ml Wasser", "50 g geschnittenen Bärlauch"]]], "st": [["", ["Alles in eine Schüssel geben und mit einem Löffel vermengen bis das Mehl vollständig mit der Flüssigkeit gebunden ist.", "Teig in einen geölten Behälter geben, abdecken.", "Am nächsten Morgen Teig direkt kalt verarbeiten: Mit einem Esslöffel oder Teigschaber Portionen abstechen und auf ein mit Backpapier belegtes Blech setzen.", "Mit Dampf im vorgeheizten Ofen bei 230 Grad (Ober-Unterhitze) ca. 20Min. mit viel Dampf backen, bis die Weckerl goldbraun sind.", "Abschließen kurz auskühlen lassen und frisch genießen."]]], "notes": "", "src": {"n": "", "a": "ichmachpizza", "u": ""}}, {"id": "rmut9b48f690oy", "t": "Johannisbeer-Tarte", "c": ["Backen", "Desserts & Süßes"], "tags": ["Französisch"], "sv": "1 Tarte", "prep": 30, "cook": 30, "rest": 120, "total": null, "diff": "anspruchsvoll", "ing": [["Kompott", ["42 g Maisstärke", "150 g Zucker", "12 g Verjus", "100 g Wasser", "800 g Johannisbeeren"]], ["Meringue", ["220 g Johannisbeersirup (50% Zucker)", "150 g Eiweiss", "Salz"]], ["Boden", ["300 g Mehl", "120 g Puderzucker", "6 g Salz", "50 g Ei", "180 g Butter", "50 g Ei"]]], "st": [["Kompott", ["Maisstärke, Zucker, Wasser und Verjus aufkochen.", "500g Johannisbeeren dazugeben und für ca. 10 min einkochen, bis die Masse stark andickt.", "Die restlichen 300g Johannisbeeren dazugeben und einmal aufkochen.", "Das Kompott für 2 Stunden kalt stellen."]], ["Boden", ["Alle Zutaten in einem Mixer stark und kurz mixen, bis der Teig gerade homogen ist.\nFür 45 min kalt stellen.", "Auf 3 mm ausrollen, in eine 28 cm-Tarteform auslegen, 1 Stunde kalt stellen und danach den Rand abschneiden.", "Bei 160 Grad ca. 20 min. blind backen bis die Tarte gerade hellbraun wird.", "1 Ei und 35g vom übrigen Mürbeteig mixen, dass ein flüssiger Teig entsteht.", "Damit die Tarte einstreichen und nochmal bei 160 Grad weiterbacken, bis sie schön braun ist."]], ["Meringue", ["Das Eiweiß zu einem weichen Eischnee aufschlagen.", "Parallel den Sirup kochen, bis er 118 Grad erreicht hat und dann langsam zum Eiweiß gießen und weiterschlagen bis die Meringue fest wird."]]], "notes": "", "src": {"n": "", "a": "", "u": ""}}, {"id": "rmut9okgn5nbng", "t": "Warmer Rotkohl-Salat", "c": ["Salate"], "tags": ["Vegetarisch", "Herbst", "Modern"], "sv": "6 Portionen", "prep": 5, "cook": 20, "rest": null, "total": null, "diff": "leicht", "ing": [["Salat", ["1 kleiner Rotkohl", "2 EL Apfelessig", "vorgekochter Reis", "2 Blöcke geräucherter Tofu", "4 EL rote Currypaste", "Olivenöl", "Salz", "Frühlingszwiebeln", "Erdnüsse"]], ["Erdnusssoße", ["2 große EL Erdnussmus", "1 TL Sriracha Soße", "1 EL Sojasoße", "Wasser/Milch", "Salz", "Pfeffer"]]], "st": [["", ["Den Rotkohl in sehr dünne, feine Streifen schneiden.", "Mit etwas Apfelessig vermengen und kräftig durchkneten, damit der Rotkohl etwas weicher wird.", "Den Tofu in dünne Streifen schneiden und mit etwas Olivenöl sowie 2 EL roter Currypaste vermengen.", "Anschließend auf ein mit Backpapier ausgelegtes Backblech geben.", "Den vorgekochten Reis ebenfalls mit etwas Olivenöl und 2 EL roter Ċurrypaste vermengen und auf ein mit Backpapier ausgelegtes Backblech geben.", "Tofu und Reis bei ca. 200 °C für etwa 20 Minuten im Ofen backen, bis beides leicht knusprig ist.", "In der Zwischenzeit alle Zutaten für die Erdnusssauce in einen Mixer geben und zu einer cremigen Sauce mixen. Alternativ kannst du alle Zutaten in ein verschließbares Glas geben und kräftig schütteln.", "Dabei zunächst nicht zu viel Flüssigkeit hinzufügen, sondern diese nach und nach dazugeben, bis die Sauce die gewünschte Konsistenz erreicht hat.", "Die Frühlingszwiebeln in feine Streifen schneiden und in ein kaltes Wasserbad geben, damit sie schön knackig bleiben.", "Die Erdnüsse grob hacken.", "Den fertig gebackenen Reis und Tofu zum vorbereiteten Rotkohl geben und alles gut miteinander vermengen.", "Den Salat auf einem großen Teller anrichten, die Erdnusssauce darübergeben und zum Schluss mit den gehackten Erdnüssen und den knackigen Frühlingszwiebeln toppen."]]], "notes": "", "src": {"n": "", "a": "", "u": ""}}, {"id": "rmut9w36vrkp9t", "t": "Sumach-Aubergine", "c": ["Hauptgerichte"], "tags": ["Vegetarisch"], "sv": "", "prep": null, "cook": 40, "rest": 15, "total": null, "diff": "mittel", "ing": [["", ["Auberginen", "2 mittelgroße Auberginen", "Olivenöl", "1 TL Kreuzkümmel", "1/2 TL Sumach", "Salz", "Pfeffer"]], ["Tahini-Joghurt", ["200 g griechischer Joghurt", "2 EL Tahini", "Saft von ½ Zitrone", "1 kleine Knoblauchzehe, fein gerieben", "1,5 TL Salz", "1–2 EL kaltes Wasser (weglassen wenn ihr veganen Joghurt oder Joghurt mit weniger Fett nehmt)"]], ["Paprika-Butter-Kichererbsen", ["1 Dose Kichererbsen (ca. 240 g Abtropfgewicht) ca. 25 g Butter (oder mehr wenn ihr wollt)", "1 Schalotte", "1 TL Paprikamark", "1 TL Pul Biber", "½ TL Kreuzkümmel", "½ TL edelsüßes Paprikapulver", "1,5 TL Salz ein bisschen frischen Zitronensaft zum Finish"]], ["Optionen zum Servieren", ["3-4 EL Pickled Onions", "1/4 Granatapfel, Kerne ausgelöst", "2 EL Pinienkerne, geröstet", "½ Bund glatte Petersilie, grob gehackt", "1/2 Bio-Zitrone abgerieben", "extra Sumach", "gutes Olivenöl", "warmes Fladenbrot"]]], "st": [["", ["Backofen auf 220 °C Ober-/Unterhitze vorheizen.", "Auberginenscheiben auf Küchenkrepp auslegen & salzen, ca 15min ziehen lassen, mit Zewa abtupfen, wenden und den Vorgang wiederholen.", "Mit Olivenöl, Kreuzkümmel, Salz, Sumach und etwas Pfeffer einreiben.", "Auf ein mit Backpapier belegtes Blech legen und 35-45 Minuten rösten, bis sie weich und an den Rändern dunkel bis crispy sind.", "Joghurt, Tahini, Zitronensaft, Knoblauch und Salz verrühren. Optional 1-2 EL kaltes Wasser dazu.", "Kichererbsen abseihen.", "Butter in einer Pfanne bei mittlerer Hitze schmelzen.", "Paprikamark dazugeben und etwa 1-2 Minuten anrösten.", "Pul Biber, Kreuzkümmel und Paprikapulver dazugeben und kurz ziehen lassen.", "Kichererbsen dazu und 3-5 Minuten in der Paprika-Butter schwenken.", "Mit Salz, optional mehr Butter und nem Spritzer Zitronensaft abschmecken.", "Tahini-Joghurt großzügig auf Tellern verstreichen.", "Die Auberginen und die warmen Kichererbsen samt der Butter aus der Pfanne darauf verteilen.", "Mit Granatapfelkernen oder pickled onions und Petersilie garnieren.", "Zum Schluss mit etwas Sumach bestreuen und gutem Olivenöl und noch mehr Tahini beträufeln.", "Mit warmem Fladenbrot servieren."]]], "notes": "", "src": {"n": "", "a": "", "u": ""}}, {"id": "rmutawi9cgdr8c", "t": "Rote-Bete-Risotto", "c": ["Hauptgerichte"], "tags": ["Vegetarisch", "Italienisch"], "sv": "2 Portionen", "prep": null, "cook": 40, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["2 Knoblauchzehen", "Olivenöl zum Braten", "150 g Risottoreis", "700 ml Rote-Bete-Saft", "Muskatnuss", "Pfeffer", "Salz", "100 bis 150 g kalte Butter", "frische Basilikumblättchen", "ca. 15 Himbeeren", "50 g Ziegenfrischkäse"]]], "st": [["", ["Knoblauchzehen in dünne Scheiben schneiden und in Olivenöl anschwitzen.", "Risottoreis zufügen und kurz anrösten.", "Die Hälfte des Rote-Bete-Saftes dazugeben und mit Muskat, Pfeffer und Salz würzen.", "Bei schwacher Hitze quellen lassen und nach und nach den restlichen Saft dazugeben, bis der Risotto cremig ist.", "Butter in Würfel schneiden und unterrühren.", "Risotto abschmecken und mit Basilikumblättern und Himbeeren anrichten.", "Ziegenfrischkäse in Klecksen darübergeben."]]], "notes": "Dazu passt ein grüner Salat.", "src": {"n": "FAS, 26.09.2026", "a": "", "u": ""}}, {"id": "rmutb01oxhunay", "t": "Pilzgulasch", "c": ["Suppen & Eintöpfe", "Hauptgerichte"], "tags": ["Vegetarisch", "Herbst", "Österreichisch", "KuK-Küche"], "sv": "2 Portionen", "prep": null, "cook": 80, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["600 Gramm Pilze", "2 Zwiebeln", "2 Knoblauchzehen", "1 Bund Schnittlauch", "1 Öl", "2 Butter", "Salz", "Pfeffer", "Tomatenmark", "250 ml Gemüsebrühe", "100 ml Sahne", "Zitronensaft"]]], "st": [["", ["Die Pilze säubern und je nach Größe halbieren oder vierteln.", "Zwiebel und Knoblauch fein würfeln.", "Schnittlauch in Röllchen schneiden.", "Öl und Butter in einer großen Pfanne erhitzen. Zwiebeln und Knoblauch darin glasig dünsten.", "Die Pilze zugeben, leicht salzen und bei milder Hitze 5 Min. zugedeckt mitdünsten.", "Tomatenmark zugeben, mit Salz, Pfeffer und Paprikapulver würzen.", "Brühe zugießen und die Pilze bei mittlerer Hitze, 15 Min. bei geschlossenem Deckel garen.", "Kurz vor Ende der Garzeit geschlagene Sahne untermischen.", "Mit Zitronensaft, Salz und Pfeffer abschmecken. Zum Schluss den Schnittlauch darüberstreuen."]]], "notes": "Hinweise", "src": {"n": "ARD-Buffet", "a": "Tim Mälzer", "u": ""}}, {"id": "rmutp2ttstcyu4", "t": "Saatenbrot", "c": ["Frühstück", "Backen"], "tags": ["Vegetarisch", "Modern"], "sv": "1 Laib", "prep": 5, "cook": 70, "rest": 720, "total": null, "diff": "leicht", "ing": [["", ["100 g Sonnenblumenkerne", "150 g Haferflocken", "150 g Leinsamen", "70 g Hanfsamen", "5 EL Flohsamenschalen", "1 TL Salz", "20 g Zuckerrübensirup oder Honig", "50 g Öl", "370 g heißes Wasser"]]], "st": [["", ["Zuerst die trockenen Zutaten mischen und dann die feuchten Zutaten hinzufügen und gut vermengen.", "Über Nacht ziehen lassen.", "Eine 25 cm große Kastenform mit Backpapier auslegen, die Masse dort gleichmäßig verteilen, fest reindrücken und in einem vorgeheizten Ofen bei 180 Grad für 30 Minuten backen.", "Aus der Form herausnehmen und umgedreht weitere 20-40 Minuten goldbraun und knusprig backen."]]], "notes": "", "src": {"n": "Studio Schmaus", "a": "", "u": ""}}, {"id": "rmutpamuw7c29g", "t": "Warmer Möhren-Linsen-Salat", "c": ["Salate"], "tags": ["Vegetarisch", "Modern"], "sv": "2 Portionen", "prep": 5, "cook": 25, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["6 Karotten", "1 Dose braune Linsen (abgetropft)", "2 EL Olivenöl", "1 TL Paprika edelsüß", "Salz", "1 Bund Petersilie", "½ Bund Koriander", "2 Hände voll geröstete Pistazien", "1 rote Zwiebel", "1½ Block veganer Feta", "1-2 EL Tahina"]], ["Dressing", ["3 EL Olivenöl", "1 TL Senf", "Saft einer ½ Zitrone", "1 TL Ahornsirup", "Salz & Pfeffer"]]], "st": [["", ["Karotten in grobe Stücke schneiden und mit Olivenöl, Paprikapulver und Salz vermengen.", "Im vorgeheizten Ofen bei 220 °C etwa 25 Minuten rösten, bis sie leicht gebräunt sind.", "Währenddessen Petersilie und Koriander grob hacken und die Zwiebel fein würfeln.", "Alle Zutaten für das Dressing verrühren.", "Geröstete Karotten, Linsen, Kräuter und Zwiebel mit dem Dressing vermischen.", "Zum Schluss mit veganem Feta, Tahina und den Pistazien servieren."]]], "notes": "", "src": {"n": "", "a": "fit_sophia_laetitia", "u": "https://www.instagram.com/reels/Dauna4Tt0Xj/"}}, {"id": "rmutqptsqxwe5e", "t": "Aubergine and puy lentils", "c": ["Suppen & Eintöpfe"], "tags": ["Vegetarisch", "Modern"], "sv": "2 Portionen", "prep": null, "cook": 40, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["2 Aubergines", "200g Cherry tomatoes", "1 Red onion", "3 Garlic cloves", "800g Pre-soaked lentils", "500 ml Vegetable stock", "100 g Crème fraiche", "1 tsp (≈ 5 ml) Chili flakes", "1 Handful of fresh thyme leaves", "1 Handful of fresh oregano leaves", "Salt and pepper to season"]]], "st": [["", ["Finely chop the onion and garlic cloves, fry them in olive oil until golden brown and beautifully soft.", "Chop the aubergine into large chunks, add them to the onions together with the tomatoes.", "Fry until the tomatoes are breaking down and the aubergines become soft.", "Drain and add the lentils, the veg stock, some more olive oil and salt and pepper to the pan.", "Bring to the boil and then gently simmer for 10 minutes.", "Serve warm with a dollop of crème fraiche, chili flakes, olive oil and the fresh oregano leaves from the herb garden!"]]], "notes": "", "src": {"n": "Show up, the kitchen project at Bergen Prison", "a": "", "u": ""}}, {"id": "rmutqw4yvhf8hf", "t": "Schwarzwälder Kirschtorte", "c": ["Backen", "Desserts & Süßes"], "tags": ["Vegetarisch", "Klassiker", "Süddeutsch"], "sv": "1 Torte", "prep": 30, "cook": 90, "rest": 180, "total": null, "diff": "anspruchsvoll", "ing": [["", ["6 Eier", "6 Essl heißes Wasser", "300 gr Zucker", "1 Päckchen Vanillezucker", "2 Essl Kakao", "250 gr Mehl", "1/2 Teel Zimt", "1 Msp Nelke, gemahlen", "1 Päckchen Backpulver", "3-5 Essl Kirschwasser", "2 Gläser Sauerkirschen, abgetropft", "1/4 Liter Saft von den Kirschen", "3 Essl Kartoffelstärke", "4 Becher Sahne", "5 Päckchen Sahnesteif", "1 Prise Salz", "Schokostreusel"]]], "st": [["", ["Eier mit heißem Wasser schaumig schlagen.", "Den Zucker und Vanillezucker unter Rühren einrieseln lassen.", "Alle anderen Zutaten für den Teig mischen und zugeben.", "Kurz glatt rühren und in gefetteter Springform bei 175 Grad 50 bis 60 Minuten backen.", "Tortenboden nach dem Erkalten zweimal quer durchschneiden.", "Saft mit Stärkemehl verrühren und aufkochen.", "Kirschen zugeben und alles mischen.", "Vorher zwölf Kirschen für die Verzierung beiseitestellen.", "Den untersten Tortenboden mit Kirschwasser beträufeln und mit der Hälfte der Kirschen belegen.", "Zweiten Tortenboden darauf legen, festdrücken.", "Restliche Kirschen auf dem zweiten Boden verteilen.", "Sahne mit dem Sahnesteif steif schlagen. Ganz zum Schluss eine ganz kleine Prise Salz zufügen.", "1/3 der Sahne auf die Kirschlage geben, Tortendeckel darauf geben und andrücken.", "Mit 1/3 der Sahne den Rand der Torte bestreichen.", "Mit dem letzten 1/3 den Deckel und die Verzierung machen.", "Für die Verzierung 5 Esslöffel Sahne in eine Spritztülle fullen und 12 große Sahnetupfen auf jedes Tortenstück spritzen.", "Darauf eine gut abgetropfte Kirsche setzen.", "Den Rand mit der Schokolade bestreuen.", "Die Torte zwei bis drei Stunden kalt stellen."]]], "notes": "", "src": {"n": "Schwäbisches Kochbuch", "a": "", "u": ""}}, {"id": "rmutshofij116o", "t": "Ragù alla Bolognese", "c": ["Hauptgerichte"], "tags": ["Italienisch", "Pasta/Nudeln", "Klassiker"], "sv": "6 Portionen", "prep": 15, "cook": 60, "rest": 300, "total": null, "diff": "leicht", "ing": [["", ["1 EL Pflanzenöl", "45 g Butter", "85 g gehackte Zwiebeln", "3 Stangen Sellerie, gehackt", "4 mittelgroße Karotten, gehackt", "350g gehacktes durchwachsenes Rindfleisch", "500 g San-Marzano-Tomaten aus der Dose, klein geschnitten, mit dem Saft", "1/4 Liter Vollmilch", "1/4 Liter trockener Weißwein", "550 bis 675 g Pasta", "1 EL Butter für die Pasta", "frisch gemahlener schwarzer Pfeffer", "frisch geriebene Muskatnuss", "Parmigiano Reggiano zum Servieren"]]], "st": [["", ["Öl, Butter und gehackte Zwiebeln in den Topf geben und auf Mittelhitze schalten.", "Die Zwiebel unter Umrühren glasig anschwitzen, dann gehackten Sellerie und Karotten hinzufügen. Etwa zwei Minuten garen; umrühren, damit das Gemüse gut mit Fett überzogen ist.", "Gehacktes Rindfleisch, eine große Prise Salz und ein wenig Pfeffer dazugeben. Das Fleisch mit der Gabel zerkrümeln, sorgfältig umrühren und so lange garen, bis es nicht mehr roh und rot aussieht.", "Die Milch hinzufügen und unter häufigem Umrühren so lange brodeln lassen, bis sie völlig verdampft ist. Eine winzige Prise, etwa ⅛ TL, Muskatnuss in den Topf reiben und umrühren.", "Den Wein dazugießen und langsam verdampfen lassen, dann die Tomaten hinzufügen und alle Zutaten sorgfältig verrühren. Wenn die Tomaten zu brodeln beginnen, die Hitze verringern, sodass die Sauce sehr schwach kocht; es darf nur hin und wieder eine Blase an die Oberfläche steigen.", "Mindestens 3 Stunden unter gelegentlichem Umrühren köcheln. Es wird Ihnen auffallen, dass die Sauce trocken wird und das Fett sich vom Fleisch trennt. Damit sie nicht anbrennt, fügen Sie jedes Mal, wenn es nötig wird, ⅛l Wasser hinzu. Zum Schluss darf jedoch kein Wasser mehr vorhanden sein, und das Fett muss sich von der Sauce trennen. Mit Salz abschmecken.", "Die Sauce mit der gekochten, abgetropften Pasta vermischen; dabei die Butter hinzufügen. Frisch geriebenen Parmesan extra dazu servieren."]]], "notes": "Wenn Sie die Sauce im Voraus zubereiten wollen: Wenn Sie die Sauce nicht 3 bis 4 Stunden hintereinander überwachen können, schalten Sie die Hitze ab, wenn Sie die Küche verlassen müssen, und fahren später mir dem Kochen fort. Hauptsache, Sie bereiten die Sauce an ein und demselben Tag zu. Die fertige Sauce kann 3 Tage in einem fest verschlossenen Behälter im Kühlschrank aufbewahrt werden. Sie lässt sich aber auch einfrieren. Vor dem Vermischen mit der Pasta aufwärmen; 15 Minuten leise köcheln lassen und dabei ein- bis zweimal umrühren.", "src": {"n": "", "a": "Marcella Hazan", "u": ""}}, {"id": "rmutt25slvrs0i", "t": "Gurken-Feigen-Salat", "c": ["Salate"], "tags": ["Vegetarisch", "Modern"], "sv": "", "prep": null, "cook": 15, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["1 große Gurke", "2–4 Feigen", "14 Block Feta", "1 EL Pistazien", "1 Bio-Zitrone", "ein paar Stängel Minze", "1 EL Ahornsirup", "3 EL Olivenöl", "Salz", "Pfeffer"]]], "st": [["", ["Für das Dressing die Zitrone auspressen und den Saft mit Olivenöl, Ahornsirup, Salz und Pfeffer verrühren.", "Die Gurke längs in sehr dünne Scheiben hobeln.", "Die Minzblätter von den Stängeln zupfen und zusammen mit der Gurke in eine Schüssel geben. Mit dem Dressing vorsichtig vermengen.", "Die Gurken auf einer Servierplatte anrichten.", "Die Feigen in Scheiben schneiden und darauf verteilen. Die Pistazien grob hacken und den Feta darüberbröseln.", "Zum Schluss mit den Pistazien toppen und nach Belieben noch etwas Pfeffer darübergeben."]]], "notes": "", "src": {"n": "", "a": "Giusi_Food/Instagram", "u": ""}}, {"id": "rmutt729kl5r7s", "t": "Kürbiscremesuppe", "c": ["Suppen & Eintöpfe"], "tags": ["Vegetarisch", "Klassiker", "Österreichisch", "KuK-Küche", "Herbst"], "sv": "4 Portionen", "prep": null, "cook": 45, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["1 Hookaido-Kürbis", "1 große Zwiebel", "30g Butter", "50-100ml Schlagobers", "100 g geröstete Kürbiskerne", "200 g Panko", "100 g Mehl", "1 Ei", "Pfeffer", "Salz"]]], "st": [["", ["1 Hookaido-Kürbis vierteln und 3/4 davon klein schneiden. 1/4 davon mit der Mandoline klein hobeln.", "1 große Zwiebel grob schneiden und in einen Suppentopf glasig anschwitzen.", "Kürbis ebenfalls mit in den Topf. Mit ca 700 ml Suppe und einer Prise Salz und Muskat aufgießen und köcheln lassen.", "Wenn der Kürbis weich ist circa 30 g Butter und gegebenenfalls 50-100 ml Schlagobers dazu. Mixen!", "100 g geröstete Kürbiskerne mörsern und mit 200 g Panko vermischen.", "100 g Mehl in einen Teller geben, die gehobelten Kürbisse dazu.", "1 Ei verquirlen, die Kürbisspalten dazu.", "Direkt danach in die Panko-Mischung und frittieren.", "Mit Schlagobers, Kürbiskernöl und knusprigen Kürbis anrichten! Guten Appetit!"]]], "notes": "", "src": {"n": "", "a": "LeoDoppler.cooks/Instagram", "u": ""}}, {"id": "rmutthqzlj9a7u", "t": "Low-Carb-Bohnen-Carbonara", "c": ["Vorspeisen & Snacks"], "tags": ["Modern", "Italienisch"], "sv": "2 Portionen", "prep": 5, "cook": 15, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["1 Dose weisse Bohnen, abgetropft", "100 g Guanciale", "2 Eigelb", "50 g Parmesan, am besten 36 Monate gereift", "Frisch gemahlener schwarzer Pfeffer"]]], "st": [["", ["Guanciale in Würfel schneiden und in einer kalten Pfanne langsam knusprig braten.", "Bohnen abgiessen, zum Guanciale geben und kurz mit braten.", "Eigelb mit frisch geriebenem Parmesan und reichlich schwarzem Pfeffer vermengen.", "Die Pfanne vom Herd nehmen und die Mischung unter die Bohnen rühren, bis alles schön cremig ist.", "Direkt servieren und am besten mit einer kalten Birra Moretti geniesäsen. Salute!"]]], "notes": "", "src": {"n": "", "a": "Noah Bachofen/Instagram", "u": ""}}, {"id": "rmutu3175v28t0", "t": "Zitronen-Mohn-Kuchen", "c": ["Desserts & Süßes", "Backen"], "tags": ["Vegetarisch", "Klassiker", "Kuchen"], "sv": "1 Kastenform", "prep": 20, "cook": 50, "rest": 30, "total": null, "diff": "leicht", "ing": [["", ["3 Eier", "225 g Zucker", "120 ml Schlagsahne", "75 g Butter (plus ein wenig mehr zum Einfetten der Form)", "10 g Mohn (Samen)", "1 EL Zitronenabrieb (fein geriebene Schale von 3 Bio-Zitronen)", "170 g Mehl", "1 1/4 TL Backpulver", "1/4 TL Salz"]], ["Für den Zuckerguss", ["100 g Puderzucker", "2 EL Zitronensaft"]]], "st": [["", ["Den Ofen mit Umluft auf 160 Grad vorheizen. Kastenform mit Backpapier auslegen, mit etwas Butter einfetten.", "Eier und Zucker mit dem Handrührgerät 2 Minuten lang vermengen, bis die Masse blass und schaumig ist.", "Sahne dazugießen und weitere Hitze zergehen lassen, Mohnsamen und Zitronenschale unterrühren.", "Mehl, Backpulver und Salz sieben, zu der Eiermischung geben.", "Dann die Butter-Zitronen-Mischung unterrühren.", "Teig in die Kastenform füllen.", "Ungefähr 50 Minuten lang im Ofen backen.", "Für den Zuckerguss Puderzucker und Zitronensaft vermengen.", "Gleichmäßig über den noch warmen Kuchen verteilen.", "Vor dem Servieren mindestens 30 Minuten lang stehen lassen."]]], "notes": "", "src": {"n": "", "a": "Ottolenghi", "u": "https://www.zeit.de/zeit-magazin/2017/45/zitronenkuchen-mohn-rezept-wochenmarkt"}}, {"id": "rmutu8vosj8se6", "t": "Apfel-Zwiebel-Chutney", "c": ["Pickles & Fermentiertes", "Vorspeisen & Snacks"], "tags": ["Vegetarisch", "Chutney", "Dip", "Herbst"], "sv": "4 Gläser mit je 360ml", "prep": null, "cook": 25, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["180 g Zwiebeln (rote, weiße)", "20 g Ingwer", "1 kg Äpfel", "200 g Vollrohrzucker", "1 Schote Vanille", "1 EL Apfelpektin", "1 EL Olivenöl", "2,5 TL Salz", "1 TL Piment d'Espelette", "250 ml Weißwein", "250 ml Apfelessig"]]], "st": [["", ["Die Zwiebeln in feine Würfel schneiden, den Ingwer fein hacken.", "Die Äpfel schälen und in Würfel schneiden, die Vanilleschote aufschlitzen und das Mark herauskratzen.", "Das Apfelpektin mit einem Esslöffel Zucker vermischen.", "Das Olivenöl in einem großen Topf erhitzen und die Zwiebeln darin glasig anschwitzen.", "Die Zwiebeln mit dem Weißwein ablöschen.", "Den Wein aufkochen und fünf Minuten köcheln lassen.", "Äpfel, Zucker, Ingwer, Essig, Salz, Piment d'Espelette und das Mark und die Schote der Vanille hinzugeben, erneut aufkochen und vier Minuten köcheln lassen.", "Anschließend das Apfelpektin einrühren und eine Minute köcheln lassen.", "Das Chutney heiß in sterile Gläser füllen und fest verschließen."]]], "notes": "", "src": {"n": "", "a": "Manufactum", "u": "https://www.manufactum.de/apfel-zwiebel-chutney-c200056/"}}, {"id": "rmutuc276yy1dt", "t": "Bärlauch-Maultaschen", "c": ["Hauptgerichte"], "tags": ["Schwäbisch", "Modern", "Pasta/Nudeln", "Teigtaschen"], "sv": "", "prep": null, "cook": 45, "rest": 150, "total": null, "diff": "mittel", "ing": [["Für den Pastateig", ["400 g Mehl (Type 550)", "4 Eier", "1 TL Salz", "2 EL Wasser", "1 EL kräftiges Olivenöl", "Gemüsebrühe zum Garen der Maultaschen"]], ["Für die Füllung", ["200 g Babyspinat, gewaschen", "120 g Bärlauch, geputzt und gehackt", "3 Eier", "250 g Ricotta", "30 g Tomami® Tomate ca. 2 TL Meersalz (10 g)", "Pfeffer und Muskat nach Geschmack", "1 TL Zitronenabrieb", "2 EL Zitronensaft", "150 g Zwiebeln, gewürfelt", "150 g Karottenbrunoise (fein gewürfelte Karotten)", "150 g Mie de Pain (Weißbrotwürfel, entrindet)", "Olivenöl zum Dünsten"]]], "st": [["", ["Für den Teig Mehl, Eier, Salz, Wasser und Öl vermengen und zu einem glatten, elastischen Teig verkneten.", "Unser Tipp: Verquirlen Sie zuerst die Eier und fügen Sie sie anschließend zu Mehl, Salz und Olivenöl. Beginnen Sie dann mit dem Herstellen des Teiges und geben Sie Wasser nur schluckweise und nach Bedarf hinzu. Manchmal genügt es bereits, die Hände vor dem Verkneten leicht mit Wasser zu benässen, um noch etwas Feuchtigkeit in den Teig zu bekommen, falls er zu trocken ist.", "Den Teig zu einer Kugel formen und abgedeckt ca. 60 Minuten oder über Nacht ruhen lassen.", "Wenn Sie die Maultaschen nicht am selben Tag zubereiten möchten, können Sie stattdessen den Teig auch über Nacht einfrieren, so wird der Teig noch geschmeidiger.", "Anschließend Spinat, Bärlauch, Eier, Ricotta, Tomami® Tomate und Gewürze sowie Zitronenabrieb und Zitronenschale mit dem Stabmixer pürieren, bis eine homogene Masse entsteht.", "Die Zwiebeln sanft in etwas Olivenöl anschwitzen, bis sie glasig sind.", "Dann die Karottenbrunoise hinzufügen und weichdünsten.", "Zwiebeln und Karotten zur Spinat-Bärlauch-Masse geben, die Weißbrotwürfel zufügen und alle Zutaten gut miteinander vermengen. Die Füllung etwa 30 Minuten lang quellen lassen. Die Füllung etwa 30 Minuten lang quellen lassen.", "Nun den Teig etwa 2 Millimeter dünn zu einem großen Rechteck ausrollen.", "Die vorbereitete Füllung daraufgeben und den Teig von der langen Seite her fest zu einem Strudel aufrollen, dabei vorsichtig andrücken.", "In Stücke schneiden (mit einem breiten Messerrücken) und diese in siedender Gemüsebrühe garziehen lassen.", "In ein wenig Olivenöl anbraten, bevor Sie die Maultaschen auf Salat anrichten."]]], "notes": "", "src": {"n": "", "a": "Manufactum", "u": "https://www.manufactum.de/baerlauch-maultaschen-salat-c202522/"}}, {"id": "rmutujz8jru3mf", "t": "Erdbeer-Rhabarber-Schnecken", "c": ["Backen", "Desserts & Süßes"], "tags": ["Vegetarisch"], "sv": "24 Schnecken", "prep": null, "cook": 120, "rest": null, "total": null, "diff": "mittel", "ing": [["Für den Hefesüßteig", ["250 ml Milch", "75 g Zucker", "1 Ei", "1 Würfel Frischhefe (42 g)", "580 g Weizenmehl", "75 g Butter (gekühlt)", "1 gehäufter TL Salz (8 g)"]], ["Für die Erdbeer-Rhabarber-Füllung mit Frischkäse", ["600 g Frischkäse", "50 g Zucker", "1 Ei", "20 g Speisestärke", "200 g Erdbeer-Fruchtaufstrich", "150 g Rhabarber, geputzt und in kleine Stücke geschnitten"]]], "st": [["", ["Den Zucker in der Milch (kalt!) auflösen.", "Die Hefe zur Milch-Zucker-Mischung geben und anschließend Mehl und Ei zufügen.", "Kurz ankneten, bis sich alle Zutaten gut verbunden haben.", "Im nächsten Schritt die kalte Butter in Stücken unterkneten.", "So wird sie besser vom Teig aufgenommen.", "Insgesamt etwa 10 Minuten kneten, dann erst das Salz zufügen.", "So wird der Teig deutlich elastischer und kann intensiv ausgeknetet werden.", "Abgedeckt mind. 45 Minuten bei Raumtemperatur reifen lassen.", "Nun den Teig durch mehrfaches Falten spannen, wie Bäcker*innen sagen, um später gärstabile Teighänge mit luftigem Volumen zu erhalten.", "Noch einmal 15 Minuten abgedeckt ruhen lassen.", "Währenddessen den Frischkäse mit Zucker, Ei sowie Speisestärke glattrühren.", "Den Teig halbieren.", "Je eine Hälfte auf der bemehlten Arbeitsfläche auf ein Format von ca. 60 × 40 cm ausrollen und mit der Hälfte der Frischkäsemasse bestreichen.", "Je 100 Gramm Erdbeer-Fruchtaufstrich auf die Frischkäseschicht streichen, zuletzt den in kleine Stünk geschnittenen Rhabarber halbe darauf verteilen.", "Von der langen Seite her unter geschnittenen Rhabarber halbe-halbe gleichmäßig Spannung zu einer Rolle aufwickeln.", "Die Teigrollen mit einem Messer (oder einem Stück Bindfaden) in je 12 gleichgroße Stücke teilen.", "Mit der Schnittfläche nach oben in die gefetteten Bratrohrpfannen setzen und erneut 20 Minuten abgedeckt ruhen lassen.", "Dann bei 190 °C (Ober-/Unterhitze) etwa 25 Minuten backen.", "Die Schnecken aus dem Ofen nehmen und noch warm mit dem Läuterzuckerguss abstreichen. Nach Belieben mit Hagelzucker dekorieren."]]], "notes": "Reife-/Gehzeit insgesamt mind. 60 Minuten. Die Teighänge sind reif, wenn sie deutlich an Volumen zugenommen haben und auf leichten Druck nachgeben.\n\nFenstertest“: Ausgekneteter Hefesüßteig lässt sich dünn ausziehen, ohne zu reißen. Daran erkennen Sie, dass der Teig ausreichend lange geknetet wurde. Die empfohlenen Knetzeiten für dieses Rezept: Wenn Sie die NOVA von Häussler aus unserem Sortiment in Gebrauch haben, kneten Sie den Teig vierten Gang. Wenn Sie die Ankarsrum“ im Einsatz haben: 10 Minuten im ersten Gang, anschließend 10 Minuten im Schnellgang.", "src": {"n": "", "a": "Manufactum", "u": "https://www.manufactum.de/hefeschnecken-c202402/"}}, {"id": "rmutuukrl7fspg", "t": "Steckrüben-Kimchi", "c": ["Pickles & Fermentiertes"], "tags": ["Kimchi", "Winter"], "sv": "", "prep": 15, "cook": 30, "rest": 17280, "total": null, "diff": "mittel", "ing": [["", ["Steckrübe", "Birne", "Chinakohl"]], ["Paste", ["Zwiebeln", "Knoblauch", "Birnen", "geröstete Mandeln", "Salz", "Paprikapulver", "Ingwer", "eine Chilischote", "Zitronensaft"]]], "st": [["", ["Den Chinakohl zerlegen wir in seine einzelnen Segmente, bestreuen sie mit Salz und stapeln die Blätter übereinander. Bei diesem Vorgang, der ca. 1,5 Stunden in Anspruch nimmt, entziehen wir dem Chinakohl einen Teil seines Wassers.", "Die Steckrübe schälen wir sorgfältig, schneiden sie in große Stücke und raspeln Sie mit der groben Seite des Vierkanthobels. Dadurch bekommen wir auch hier eine größere Oberfläche. Wir lassen die Steckrübe so und salzen sie nicht nochmal zusätzlich ein.", "Für die Paste nehmen wir uns Zwiebeln, Knoblauch, Birnen, geröstete Mandeln, Salz, Paprikapulver, Ingwer, eine Chilischote und Zitronensaft. Die Birne bringt eine gewisse Süße in das Kimchi und damit Zucker, der Nahrung für die Milchsäurebakterien ist und dadurch zu einer optimalen Fermentation beiträgt. Die Mandeln sind eher ungewöhnlich in einem Kimchi. Wir hatten noch einige von unserem Nussaufstrich mit Apfelkernen, so entstehen bekanntlich die besten Rezepte!", "Alle Zutaten lassen wir nun, mit ein wenig alter Sojasauce für 2–3 Minuten fein mixen. Es entsteht eine ausgewogene tiefrote Würz-Paste.", "Den gesalzenen Chinakohl drücken wir kräftig aus, damit er das überschüssige Wasser verliert.", "Wir schneiden unsere Chilis in feine Scheiben, die überreifen Birnen reiben wir grob runter, Mandeln geben wir als geröstete Stifte dazu.", "Den gesalzenen, ausgedrückten Chinakohl schneiden wir in breite Streifen.", "Wir mischen alle Zutaten in einem tiefen Blech, hierbei massieren wir die Würz-Paste sorgfältig ein.", "Nachdem wir alles eingerieben haben, wird ein Teil in ein handelsübliches Weckglas gefüllt, das wir vorher mit kochendem Wasser ausgespült haben. Hierbei ist zu beachten, dass man den Kohl, mit Druck in das Glas presst, so verschwinden Lufteinschlüsse.", "Den restlichen Kohl vakuumieren wir.", "An Tag 5 können wir beobachten, wie sich der Beutel langsam aufbläht, die Kraft der Natur zeigt ihre Wirkung. Nur durch die Arbeit von kleinen Mikroorganismen entsteht aus Zucker und Sauerstoff Kohlendioxid.", "Am siebten Tag können wir eine deutliche Blähung des Beutels sehen.", "An Tag 8 legen wir den Kimchi bei 3°C kühl und lassen ihn weitere Tage reifen. Beim Öffnen vom Steckrüben-Kimchi kommt uns ein Geruch entgegen, der an Krautsalat mit einer leichten Knoblauchnote erinnert. Das Kimchi ist leicht suppig und sieht aus wie Sauerkraut. Die Mandeln haben sich mit dem Sud vollgesogen, behalten aber eine gewisse nussige Note. Die Schärfe wurde durch die Fermentation gemildert. Uns schmeckt das Steckrüben Kimchi wirklich sehr gut!"]]], "notes": "Die Birne bringt eine gewisse Süße in das Kimchi und damit Zucker, der Nahrung für die Milchsäurebakterien ist und dadurch zu einer optimalen Fermentation beiträgt. Die Mandeln sind eher ungewöhnlich in einem Kimchi. Wir hatten noch einige von unserem Nussaufstrich mit Apfelkernen, so entstehen bekanntlich die besten Rezepte!", "src": {"n": "", "a": "", "u": "https://www.milk-food.de/insights/magazin/sauerkraut-mal-anders/"}}, {"id": "rmutv1p70nt9py", "t": "Rotkohl-Kimchi", "c": ["Pickles & Fermentiertes"], "tags": ["Kimchi", "Winter"], "sv": "", "prep": 10, "cook": 40, "rest": 17280, "total": null, "diff": "mittel", "ing": [["", ["1 Rotkohl", "Apfel", "Rettich", "Karotten", "Lorbeer", "Zimtstangen", "Knoblauch"]], ["Würzpaste", ["1 Orange", "Ingwer", "Apfel", "Honig"]]], "st": [["", ["Wir schneiden den Rotkohl in grobe Stücke.", "Um auch bei diesem Kohl einen Teil vom Wasser zu lösen, salzen wir ihn kräftig ein. Abgedeckt lassen wir den Kohl so für 1,5 Stunden bei Raumtemperatur stehen. Zwischendurch mengen wir ihn 2-mal durch, da der Kohl von Natur aus eine sehr dicke-feste Struktur hat.", "Für unsere Würzpaste filetieren wir uns eine Orange und schneiden Ingwer und Apfel in grobe Stücke. Diese Zutaten und ein wenig von unserem Honig mixen wir kräftig durch. Als weitere Einlage für den Kimchi reiben wir Apfel, Rettich und Karotten grob runter.", "Apfel, Rettich und Karotten", "Der Kohl hat nach dem Einsalzen eine Menge an Wasser verloren, wir drücken ihn zusätzlich aus und geben ihn dann mit den restlichen gehobelten Zutaten in einen tiefen Behälter.", "Typische Gewürze für Rotkohl sind Lorbeer, Zimtstangen und Knoblauch. Diese nutzen wir auch und mörsern sie. Anschließend kommt die Würzpaste zum Kohl, die wir gründlich einmassieren.", "Im folgenden Schritt geben wir die gemörserten Gewürze dazu.", "Ein Teil des Kimchi-Ansatzes wird in ein mit kochendem Wasser gespültes Weckglas gefüllt, den Rest geben wir in einen Vakuumbeutel.", "Man kann an Tag 5 beobachten wie die Milchsäure Bakterien arbeiten und sich der Vakuumbeutel langsam aufbläht. Erstaunlicherweise hat sich der Beutel vom Rotkohl-Kimchi nicht so sehr aufgebläht wie der von Steckrübe oder Weißkohl.", "An Tag 12 öffnen wir zum ersten Mal das Glas. Der Rotkohl-Kimchi ist sehr fruchtig im Geruch, das hat filigrane Spuren eines Parfüms. Er ist knackig-fest im Biss, der kräftige Geschmack ist durch die Fermentation stark zurückgegangen. Wir lassen diesen Kimchi noch etwas weiterreifen. Bis Weihnachten ist schließlich noch etwas Zeit – wobei wir uns diese mild-fruchtige Rotkraut Version auch sehr gut als leichtes Sommerkraut vorstellen können."]]], "notes": "", "src": {"n": "", "a": "", "u": "https://www.milk-food.de/insights/magazin/sauerkraut-mal-anders/"}}, {"id": "rmutvazbqnhjd3", "t": "Weißkohl-Kimchi", "c": ["Pickles & Fermentiertes"], "tags": ["Vegetarisch", "Modern"], "sv": "", "prep": 45, "cook": null, "rest": 17280, "total": null, "diff": "mittel", "ing": [["", ["1 Weißkohl", "Jodfreies Salz"]], ["Würzpaste", ["rote und grüne Chilis", "Zitronenschale", "Ananas", "Ingwer", "Lauch", "Zwiebel", "Knoblauch", "Karotten", "Fischsauce", "Chiliflocken", "geräuchertes Paprikapulver"]]], "st": [["", ["Für unseren Kimchi schneiden wir zuerst den Weißkohl in grobe Streifen. So gewinnen wir eine größere Oberfläche beim Kohl. Salz und Gewürze haben hierdurch die Möglichkeit besser einzudringen. Das koreanische Kimchi wird mit Chinakohl zubereitet, wir verwenden den typisch deutschen Weißkohl. Diesen salzen wir kräftig ein. Der Kohl entwässert dadurch und kann die Würzpaste besser aufnehmen. Dieser Prozess dauert ca. 1 Stunde.", "In dieser Zeit bereiten wir die Paste zu. Sie gibt dem Kimchi den typischen Geschmack und ist ein wesentlicher Unterschied zu unserem Sauerkraut, das eher verhalten gewürzt ist.", "Für die Paste schneiden wir rote und grüne Chilis, Zitronenschale, Ananas, Ingwer, Lauch, Zwiebel, Knoblauch und Karotten klein.", "Die verschiedenen Zutaten werden unter Zugabe von Fischsauce, Chiliflocken und geräucherten Paprikapulver zu einer feinen Paste gemixt. Beim Öffnen des Mixbechers nehmen wir schon die Fruchtigkeit der Ananas, ein leichter Zwiebelgeruch gepaart mit dem rauchigen Duft des Paprikapulvers wahr.", "Den gesalzenen Weißkohl drücken wir kräftig aus.", "Diesen und die anderen vorbereiteten Zutaten geben wir in ein tiefes Blech, um sie mit der aromatischen Paste zu mischen. Dabei muss sehr sauber gearbeitet werden, um eine reibungslose Fermentation zu garantieren. Verunreinigungen können zu ungenießbaren Ergebnissen führen.", "Nachdem wir alle Zutaten kräftig mit der Paste einmassiert haben, kommt ein Teil in ein handelsübliches Weckglas, das wir vorher in mit kochendem Wasser ausgespült haben, um den Einfluss unerwünschter Bakterien zu minimieren. Den anderen Teil lassen wir unter Vakuum fermentieren. Beim Vakuumverfahren kann man später die Bildung von Kohlendioxid (CO2) sehr gut beobachten.", "Das Kimchi steht nun bei einer durchschnittlichen Temperatur von 18,2 °C für die nächsten 5–7 Tage im FoodLab. Anschließend kommt es in die Kühlung und reift dort weitere Tage. Hier kann man deutlich beobachten wie sich durch die Arbeit der Milchsäurebakterien der Beutel aufbläht.", "An Tag 12 öffnen wir zum ersten Mal das Glas, zu hören ist ein kräftiges Zischen und ein säuerlich-scharfer Geruch kommt uns entgegen. Viele kleine Gasbläschen steigen am Glasrand auf. Der Geschmackstest begeistert uns: leicht scharf, säuerlich aber noch sehr knackig in der Textur."]]], "notes": "", "src": {"n": "", "a": "", "u": "https://www.milk-food.de/insights/magazin/sauerkraut-mal-anders/"}}, {"id": "rmutvoeuhud83x", "t": "Kichererbsen-Eintopf aus dem Ofen", "c": ["Suppen & Eintöpfe"], "tags": ["Griechisch", "Proteinreich"], "sv": "6 Portionen", "prep": 25, "cook": 180, "rest": 15, "total": null, "diff": "leicht", "ing": [["", ["1 große Zwiebel", "2 Frühlingszwiebeln", "1 Stange Lauch", "500 g getrocknete Kichererbsen", "4 EL Olivenöl", "Saft von 3 Zitronen", "1 TL Kurkuma (gemahlen)", "1 TL Paprikapulver", "1 Prise Cayennepfeffer", "1 Prise schwarzer Pfeffer", "Wasser", "etwas Salz", "etwas frischer Dill"]]], "st": [["", ["eine Prise Cayennepfeffer, eine Prise schwarzer Pfeffer, Wasser, etwas Salz, etwas frischer Dill d (eventuell etwas mehr Wasser), sodass die Kichererbsen bedeckt sind.", "Den Bräter mit dem Deckel verschließen und im vorgeheizten Ofen bei 150 Grad Ober-/Unterhitze für circa 3 Stunden kochen, bis die Kichererbsen gar und cremig sind.", "Rund 10 Minuten vor Ende der Kochzeit Salz und Dill hinzugeben, umrühren und die restlichen 10 Minuten im Ofen schmoren."]]], "notes": "", "src": {"n": "", "a": "", "u": ""}}, {"id": "rmutwd9h8fb8t4", "t": "Citrus Mackerel Spaghetti with Pangrattato", "c": ["Hauptgerichte"], "tags": ["Pasta/Nudeln", "Italienisch", "Modern"], "sv": "6 Portionen", "prep": null, "cook": 40, "rest": null, "total": null, "diff": "leicht", "ing": [["", ["200 g stale bread", "100 ml extra virgin olive oil", "1 clove of garlic, minced", "500 g dried spaghetti", "4 125 g tins of mackerel in olive oil, drained and broken up", "1 180 g jar of capers drained and finely chopped", "2 tsp (≈ 10 ml) chilli flakes zest", "juice of 3 lemons", "a large bunch of flat-leaf parsley, leaves and stalks finely chopped", "sea salt", "ground black pepper"]]], "st": [["", ["First make the pangrattato by blitzing the bread into breadcrumbs in a food processor.", "In a frying pan, over a medium heat, heat a tablespoon (≈ 15 ml) of the olive oil and fry the breadcrumbs with the garlic until golden brown and crisp.", "I like to take them pretty dark, bordering on a little burned, hut you do you.", "Cook the spaghetti in well-salted, boiling water until al dente.", "Put the mackerel, capers, chilli flakes, lemon zest and juice, most of the parsley and half the olive oil into a large mixing bowl and combine thoroughly.", "Drain the pasta, reserving a little of the water, and add it to the mackerel mixture.", "Mix vigorously, adding a little pasta water and more olive oil if it seems too dry.", "You should end up with a glossy sauce that dings to the pasta.", "Serve on a large platter, topped with the pangrattato and the rest of the chopped parsley."]]], "notes": "", "src": {"n": "", "a": "Rosie Kellet", "u": "https://thehappyfoodie.co.uk/recipes/rosie-kellets-citrus-mackerel-spaghetti-with-pangrattato/"}}, {"id": "rmutwmnof2xc9g", "t": "Rösti mit Pilz-Maronen-Ragout", "c": ["Hauptgerichte"], "tags": ["Modern", "Vegetarisch", "Herbst", "Winter"], "sv": "", "prep": null, "cook": 50, "rest": null, "total": null, "diff": "leicht", "ing": [["Für die Rösti", ["1 kleine Zwiebel (etwa 50 g)", "280 g vorwiegend festkochende Kartoffeln", "1 EL Buchweizenmehl (etwa 15 g)", "2 Prisen Meersalz", "4 -6 TL Gehee"]], ["Für das Pilzragout", ["1 große Knoblauchzehen", "280 g Pilze (z.B. Champignons, Kräutersaitlinge)", "100 g gekochte Maronen", "2 EL Olivenöl", "1 TL getrockneter Thymian", "1 TL getrockneter Rosmarin", "1 TL getrockneter Estragon", "Salz, Pfeffer", "150 ml Mandelmilch", "1 TL Kartoffelstärke"]]], "st": [["", ["Für das Pilzragout den Knoblauch schälen und in feine Stücke schneiden. Pilze putzen und in 1 cm große Würfel schneiden.", "Öl in einer Pfanne erhitzen, Knoblauch und Pilze in die Pfanne geben und unter gelegentlichem Wenden 5 Minuten bei mittlerer Hitze anbraten. Die Pilze sollten in dieser Zeit bereits ein wenig zusammenfallen.", "Mit Thymian, Rosmarin, Estragon, Salz und Pfeffer würzen, Maronen hinzugeben und nochmal alles bei mittlerer Hitze 2 -3 Minuten braten.", "Mandelmilch und Kartoffelstärke mit einer Gabel oder einem kleinen Schneebesen gründlich vermengen, so dass sich die Stärke auflöst.", "Die Milch zu den Pilzen geben, aufkochen und dabei umrühren, dann die Hitze reduzieren. Während die Milch köchelt, wird sie sämiger und zur cremigen Sauce. Unter Rühren die Sauce 3 Minuten vorsichtig köcheln, anschließend warmhalten.", "Für die Kartoffel-Zwiebel-Rösti Zwiebel und Kartoffeln schälen und jeweils halbieren.", "Zwiebel und Kartoffeln mit Hilfe der Küchenmaschine oder einer Küchenreibe in feine Streifen raspeln.", "Streifen in eine Schüssel geben, mit Buchweizenmehl und Salz gründlich vermengen.", "2-3 TL Ghee in einer (Keramik-) Pfanne erhitzen.", "Aus der Kartoffelmasse vier Portionen in das Fett geben und flach drücken.", "Ca. 5 Minuten braten, bis sie auf der Unterseite gold-braun sind.", "Anschließend aus der Pfanne nehmen, das restliche Ghee zerlassen und die Rösti von der anderen Seite braten.", "Mit dem Ragout, ggf. Plantbullar und einem Feldsalat anrichten"]]], "notes": "", "src": {"n": "", "a": "", "u": "https://www.ikea.com/de/de/rooms/kitchen/how-to/rezept-plantbullar-mit-pilz-maronen-ragout-pub0c2831a0/"}}, {"id": "rmutxvadqrxzqj", "t": "Biang-Biang-Noodles", "c": ["Hauptgerichte"], "tags": ["Vegetarisch", "Pasta/Nudeln", "Chinesisch", "Asiatisch"], "sv": "2 Portionen", "prep": 5, "cook": 15, "rest": 60, "total": null, "diff": "mittel", "ing": [["Für den Teig", ["250 g Mehl", "1½-2 TL Salz", "135 mI Wasser (heißes)"]], ["Für die Soße", ["4 Knoblauchzehen", "1 Frühlingszwiebel", "5 EL Rapsöl (oder Sonnenblumenöl)", "1 TL Chilipulver (wer nicht scharf essen möchte, nimmt Paprikapulver)", "2 EL Sojasoße", "2 EL Essig (chinesischer)"]]], "st": [["", ["Für den Teig Mehl, Salz und heißes Wasser in einer Schüssel vermischen und drei bis vier Minuten zu einem Teig verkneten.", "Anschließend abgedeckt eine Stunde beiseitestellen.", "Für die Soße den Knoblauch schälen und pressen.", "Die Frühlingszwiebeln waschen und in Ringe schneiden.", "Nach etwa einer Stunde den Teig aus der Schüssel nehmen und in vier Portionen teilen.", "Jede zu einem Rechteck formen und in Handtellergröße leicht flachdrücken.", "In einen tiefen Teller reichlich Öl geben und alle Teigstücke darin wenden. Jedes sollte gut eingeölt und mit Öl bedeckt sein.", "Danach eine weitere Stunde zur Seite stellen.", "Einen großen Topf mit Wasser auf den Herd stellen und zum Kochen bringen.", "Zum Weiterverarbeiten eine eingeölte Teigportion auf den Tisch legen, mit der Hand flachdrücken und mit einem Stäbchen der Länge nach mittig eine Delle eindrücken, ohne dass der Teig zweigeteilt wird.", "Jeweils ein Ende mit einer Hand greifen, langsam in die Länge ziehen und vorsichtig dabei auf den Tisch klatschen.", "Die Nudel sollte nach und nach länger und dünner werden.", "Sobald sie die maximale Länge erreicht hat, entlang der Delle in der Mitte auseinander reißen.", "V Sobald die Nudeln gezogen sind, direkt ins kochende Wasser geben.", "Sie brauchen nicht lange, nach ungefähr einer Minute schwimmen sie an der Oberfläche und können herausgenommen werden.", "Alle Nudeln auf zwei Schüsseln verteilen.", "In einem kleinen Topf das Öl für die Soße erhitzen.", "Knoblauch, Frühlingszwiebeln und Chilipulver auf den Nudeln in den Schalen verteilen.", "Sobald das Öl heiß ist, über die Gewürze gießen.", "Man hört sofort, wenn es zischt, und es sollte aromatisch nach Knoblauch und Chili duften.", "Zum Schluss jeweils einen Esslöffel Sojasoße und einen Esslöffel Essig darüber geben und gut umrühren."]]], "notes": "", "src": {"n": "", "a": "Sissi Cheng", "u": "https://www.zeit.de/zeit-magazin/wochenmarkt/2024-12/biang-biang-nudeln-china-rezept-wochenmarkt"}}, {"id": "rmutygo2gizcqi", "t": "Šaltibarščiai", "c": ["Suppen & Eintöpfe"], "tags": ["Vegetarisch", "Kalte Gerichte", "Sommer"], "sv": "4 Portionen", "prep": 15, "cook": 10, "rest": 240, "total": null, "diff": "leicht", "ing": [["", ["500 ml Buttermilch", "200 ml Schmand", "4 Rote Bete (ca. 500 g), gekocht und geschält (z.B. aus dem Beutel)", "4 bis 6 Minigurken", "2 bis 3 Frühlingszwiebeln", "4 hart gekochte Eier", "½ bis 1 Bund Dill", "½ bis 1 Bund Schnittlauch", "Saft von 1 Zitrone", "2 EL Sonnenblumenöl", "Salz und Zucker zum Abschmecken"]]], "st": [["", ["Buttermilch, Schmand, Zitronensaft und Öl in einer großen Schüssel miteinander verquirlen.", "Rote Bete, Minigurken und zwei der vier hart gekochten Eier würfeln (ca. O,5 cm), die beiden anderen Eier ganz lassen (wir brauchen sie zum Servieren halbiert für die Garnitur).", "Frühlingszwiebeln in Ringe schneiden, vom Dill und Schnittlauch etwas für die Garnitur zur Seite legen, dann den Schnittlauch in Röllchen schneiden und die Dillfähnchen von den Stängeln zupfen und feinhacken.", "Gewürfelte Bete, Eier, Gurken und Kräuter zum Buttermilchschmand geben, vermengen, mit Salz und Zucker abschmecken.", "Mehrere Stunden, am besten über Nacht, durchkühlen lassen.", "Eventuell nachwürzen.", "Zum Servieren in Suppenschalen füllen, mit je einem halben gekochten Ei und ein paar Kräutern dekoriert servieren. Lassen Sie es sich schmecken!"]]], "notes": "", "src": {"n": "", "a": "Verena Lugert", "u": "https://www.spiegel.de/stil/rezept-fuer-kalte-rote-bete-suppe-aus-litauen-saltibarsciai-a-0ad0357e-4820-468c-ade5-3641900f6d19?sara_ref=re-so-app-sh"}}, {"id": "rmutyw17alc44t", "t": "Vegan Mapo Tofu", "c": ["Beilagen"], "tags": ["Vegan", "Asiatisch", "Chinesisch"], "sv": "4 Portionen", "prep": 15, "cook": 15, "rest": null, "total": null, "diff": "mittel", "ing": [["Tofu", ["1 pound (≈ 454 g) soft or silken tofu", "1.9L water", "2 teaspoons (≈ 10 ml) table or sea salt"]], ["Mushrooms", ["1 tablespoon (≈ 15 ml) neutral oil (vegetable, canola, safflower, etc.)", "65 g finely diced shiitake mushrooms"]], ["Sauce", ["3 to 4 teaspoons (≈ 15–20 ml) Sichuan peppercorn, depending on desired spice level", "1 teaspoon (≈ 5 ml) cornstarch or tapioca starch", "118 ml water", "2 tablespoons (≈ 30 ml) neutral oil (vegetable, canola, safflower, etc.)", "2 tablespoons (≈ 30 ml) minced garlic", "1 tablespoon (≈ 15 ml) minced ginger", "2 tablespoons (≈ 30 ml) doubanjiang", "1 1/2 tablespoons (≈ 22 ml; 10 g) gochugaru"]]], "st": [["Prepare the Tofu", ["Drain the block of tofu and remove it from the package. Cut the tofu into 3/4-inch (≈ 2 cm) cubes.", "Add 8 cups (≈ 1,9 l) of water and 2 teaspoons (≈ 10 ml) salt to a saucepan and bring it to boil. Remove the saucepan from heat.", "Using a skimmer or slotted spoon, carefully lower the tofu cubes into the hot water. Let the tofu sit in hot water as you prepare the sauce."]], ["Cook Mushrooms", ["Heat 1 tablespoon (≈ 15 ml) of oil in a wok over medium heat. Add the mushrooms and cook for about 2 minutes, stirring frequently.", "Transfer the mushrooms to a bowl and turn off the heat."]], ["Prepare the Sauce", ["Grind the Sichuan peppercorns with a mortar and pestle or spice gründer. Süßt the ground peppercorns through a fine mesh to süßt out the tough husks. Discard the tough husks (see note 4). cornstarch to a small bowl and stir to combine. Set it aside.", "Heat 2 tablespoons (≈ 30 ml) of oil on mediumhigh heat. Add the garlic and ginger and sauté for 30 seconds. Then, add the doubanjiang and sauté for another 30 seconds. Add the ground Sichuan peppercorn, gochugaru (or other chili flakes), and sugar and stir together. Finally, give the cornstarch slurry a stir again and add to the wok (see note 5). Add the white and light green parts of the scallion. Let the sauce simmer for 2 minutes."]], ["Mix Sauce with Mushrooms & Tofu", ["Add the sautéed mushrooms to the wok. Using a skimmer or a slotted spoon, transfer the warmed tofu to the wok as well. Then, carefully toss everything together. The tofu is very delicate and can break apart easily, so be careful.", "Transfer the mapo tofu to a serving bowl.", "Drizzle a tiny bit of sesame oil over the tofu. Garnish the tofu with the dark green parts of the scallion. Serve with jasmine rice or brown rice."]]], "notes": "1. Some soft or silken tofu comes in 14-ounce (≈ 397 g) packages, which also works for this recipe.\n2. You can find doubanjiang in Asian grocery stores, especially ones that sell Chinese ingredients. If you don't have easy access to an Asian grocer, you can find it on Amazon or Asian online stores like Yamibuy or Weee! You can use any leftover doubanjiang in these recipes:\nSpicy Eggplant Stir Fry, Spicy Peanut Noodles.\n3. I prefer using gochugaru because it gives the sauce a nice red color and a subtle smoky flavor. You can use Chinese-style chili flakes or even red pepper flakes that you can find in grocery stores. Note that different chili flakes vary in their level of spice! If you're using a very mildly spiced chili flake, use 1 tablespoon (≈ 15 ml) and add more if desired. Chili flakes from the supermarket that are sold with the seeds tend to be spicier. If you're using that type of chili flake or any spicy chili flake, start with 3/4 teaspoon (≈ 4 ml) of the flakes and add more if you want more spice.", "src": {"n": "", "a": "Lisa Lin", "u": "https://healthynibblesandbits.com/vegetarian-mapo-tofu/"}}];

  if(r.FREQ==='DAILY')c=[at(y,s.getMonth(),s.getDate()+k*iv)];
  else if(r.FREQ==='WEEKLY'){const b=s.getDate()+k*7*iv;c=by?by.map(x=>at(y,s.getMonth(),b-s.getDay()+WDS.indexOf(x.slice(-2)))):[at(y,s.getMonth(),b)]}
  else if(r.FREQ==='MONTHLY'){const m=s.getMonth()+k*iv;if(by)c=by.map(x=>{const o=+(x.slice(0,-2)||1),w=WDS.indexOf(x.slice(-2));if(o>0){const f=new Date(y,m,1).getDay();return at(y,m,1+(w-f+7)%7+(o-1)*7)}const L=new Date(y,m+1,0);return at(y,m,L.getDate()-((L.getDay()-w+7)%7)+(o+1)*7)});else{const d=r.BYMONTHDAY?+r.BYMONTHDAY:s.getDate(),x=at(y,m,d);c=x.getDate()===d?[x]:[]}c=c.filter(x=>x.getMonth()===m%12)}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in==='spVol'){spVolume(t.value);return}if(t.classList.contains('spp-qi')){D.spQ=t.value;spFilter();return}if(t.id==='eName'){dash().name=t.value;$('#dashName').textContent=t.value;save();return}if(t.dataset.col||t.dataset.hex){const k=t.dataset.col||t.dataset.hex;let v=t.value.trim();if(t.dataset.hex){if(!/^#?[0-9a-f]{6}$/i.test(v))return;v=('#'+v.replace('#','')).toLowerCase();const pk=document.querySelector(`[data-col="${k}"]`);if(pk)pk.value=v}else{const hx=document.querySelector(`[data-hex="${k}"]`);if(hx)hx.value=v.toUpperCase()}S.col={...curCol(),[k]:v};S.colName='custom';save();applyLook();document.querySelectorAll('.combo.on,.single.on').forEach(x=>x.classList.remove('on'));return}if(t.dataset.in==='dName'){DASHES[+t.dataset.d].name=t.value;save()}});

let hdrT;const showHdr=()=>{if(editing)return;$('#hdr').classList.remove('off');$('#pdots').classList.remove('off');clearTimeout(hdrT);hdrT=setTimeout(()=>{if($('#menu').hidden){$('#hdr').classList.add('off');$('#pdots').classList.add('off')}},5000)};
document.addEventListener('pointerdown',()=>{showHdr();wake();if(LS.get('g_ok',false)&&!gValid()&&Date.now()-gTried>120000)gAuth('')},{passive:true});

/* ---------- Start ---------- */
(async()=>{
 applyLook();showHdr();$('#demoTag').hidden=!S.demo;
 $('#fsBtn').hidden=!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
 await spCallback();
 await loadRecipePhotos();
 renderStage();
 if(LS.get('g_ok',false))gInit().catch(()=>{});
 loadWeather();loadCalendar();loadNews();loadPhotos();loadSpotify();loadWiki();loadPegel();wake();
 setInterval(loadPegel,10*60000);
 let lastMin=-1,lastDay=new Date().getDate();
 setInterval(()=>{const t=new Date();repaint(...CLOCKS,'date');if(t.getSeconds()%3===0)mounted.forEach(m=>{if(m.key==='gestirne'&&m.el._gs){const st=m.el._gs;st.h=((st.h||0)+1)%4;const cv=m.el.querySelector('.gs-hc');if(cv)GS.portrait(cv.getContext('2d'),['A','H','B','M'][st.h],getComputedStyle(m.el).color)}});if(D.popKind==='spotify'&&D.sp&&!D.sp.idle){const i=document.querySelector('.spp-seek i'),p=$('#sppPos');if(i)i.style.width=spPct()+'%';if(p)p.textContent=fmtMs(D.sp.prog+(D.sp.playing?Date.now()-D.sp.at:0))}
  mounted.forEach(m=>{if(m.key==='spotify'){const b=m.el.querySelector('.sp-bar i');if(b)b.style.width=spPct()+'%'}});
  if(t.getMinutes()!==lastMin){lastMin=t.getMinutes();applyLook();repaint(...CALW,'solar','world','photos','day-poster','sun');if(t.getDate()!==lastDay){lastDay=t.getDate();loadCalendar();loadWeather();loadWiki();repaint('recipe')}}},1000);
 setInterval(()=>{const L=photoList();D.photoIdx=(D.photoIdx+1)%L.length;new Image().src=L[(D.photoIdx+1)%L.length];repaint('photos');mounted.forEach(m=>{if(m.key==='news'){m.el._ni=(m.el._ni||0)+1;W.news(m.el);refitSoon(m.el)}if(m.key==='wiki'){m.el._wi=(m.el._wi||0)+1;W.wiki(m.el);refitSoon(m.el)}})},10000);
 setInterval(()=>{loadWeather();loadCalendar();loadNews()},15*60000);
 setInterval(()=>{if(document.visibilityState==='visible'&&SP.t&&mounted.some(m=>m.key==='spotify')&&(D.sp?.playing||Date.now()-spLast>20000))loadSpotify()},5000);
})();
</script>
